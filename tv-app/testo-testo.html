<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Test Testo Puro</title>
</head>
<body style="background:#080a12; color:#d8d2c8; font-family:sans-serif; padding:40px;">
    <h1>🧪 Test Fetch Testo - Via di Mezzo</h1>
    <p>URL Target: <code>https://hollyandrex-cell.github.io/massy.github.io/testi-luna.html</code></p>
    
    <div id="risultato" style="border:1px solid #333; padding:20px; margin-top:20px; white-space:pre-line; min-height:50px; background:#111;">
        In attesa...
    </div>

    <script>
        console.log('🚀 Inizio test fetch...');
        const url = 'https://hollyandrex-cell.github.io/massy.github.io/testi-luna.html';
        const id = 'viadimezzo';

        fetch(url)
            .then(res => {
                console.log('📥 Risposta:', res.status);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.text();
            })
            .then(html => {
                console.log('📄 HTML ricevuto. Lunghezza:', html.length);
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const el = doc.getElementById(id);
                
                const box = document.getElementById('risultato');
                
                if (el) {
                    console.log('✅ Elemento #' + id + ' TROVATO!');
                    box.innerHTML = el.innerHTML;
                    box.style.color = '#22c55e';
                } else {
                    console.warn('⚠️ Elemento #' + id + ' NON TROVATO.');
                    const allIds = Array.from(doc.body.querySelectorAll('[id]')).map(e => e.id);
                    box.textContent = 'ID non trovato. ID presenti: ' + allIds.join(', ');
                    box.style.color = '#ef4444';
                }
            })
            .catch(err => {
                console.error('❌ ERRORE:', err);
                document.getElementById('risultato').textContent = 'ERRORE: ' + err.message;
                document.getElementById('risultato').style.color = '#ef4444';
            });
    </script>
</body>
</html>
