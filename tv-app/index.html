ma con loro sto bene, lo dico davvero....

a volte son bau,

datemi tempo e vi stupirò.

non serve il guinzaglio neanche il collare,
son proprio una BIMBA da incorniciare.
alla mia mamma stò sempre vicino,
e non dò confidenza neanche al vicino.

datemi tempo e vi stupirò.
