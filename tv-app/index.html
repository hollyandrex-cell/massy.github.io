<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

<title>Holly & Rex TV - Ling Edition</title>

<!-- META DESCRIPTION PER GOOGLE -->
<meta name="description" content="Holly and Rex Group: un viaggio musicale con Rex, Bimba, Dj Ling, Dj Luna, Dj Nova. Questa TV non trasmette segnali, trasmette battiti. 49 brani integrali.">
<meta name="keywords" content="Holly Rex TV, Dj Ling, canzoni italiane, musica indipendente, Rex, Bimba, Luna, Nova">

<style>
   /* PULSANTE DI RITORNO AL DRIVE - VERSIONE OTTIMIZZATA */
   .btn-back-drive {
    position: fixed !important;
    top: 60px !important;      /* Leggermente più in basso per non toccare il bordo */
    left: 1150px !important;     /* 40px di respiro dal bordo sinistro */
    z-index: 9999 !important;  /* Sopra a tutto, inclusa la welcome screen */
    
    background: rgba(15, 18, 28, 0.9); /* Sfondo scuro semi-trasparente */
    border: 1px solid rgba(255, 255, 255, 0.15); /* Bordo sottile luminoso */
    color: #ffffff;
    padding: 10px 22px;
    border-radius: 30px;       /* Forma a pillola più morbida */
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    backdrop-filter: blur(15px);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Inter', sans-serif;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
}

.btn-back-drive:hover {
    background: #ff6b8a;
    color: #000;
    border-color: #ff6b8a;
    transform: translateY(-2px) scale(1.05);
    box-shadow: 0 8px 25px rgba(255, 107, 138, 0.5);
}
.btn-back-drive:hover {
    background: #ff6b8a;
    color: #000000;
    border-color: #ff6b8a;
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 6px 20px rgba(255, 107, 138, 0.4);
}
*{box-sizing:border-box} body{margin:0;background:#080a12;color:#e8e6e3;font-family:'Inter',sans-serif;overflow-x:hidden}

/* WELCOME SCREEN */
#welcomeScreen {
    position: fixed; inset: 0; z-index: 9999;
    /* BACKGROUND RIMOSSO: ORA GESTITO DAL TAG <PICTURE> */
    background-color: #080a12; /* Colore di fallback */
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 20px; transition: opacity 0.8s ease, visibility 0.8s;
}
#welcomeScreen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.welcome-overlay { background: rgba(8,10,18,0.7); padding: 40px; border-radius: 20px; backdrop-filter: blur(8px); max-width: 600px; margin: 20px; position: relative; z-index: 10; }
.welcome-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(24px, 5vw, 36px); color: #f5f0e8; margin: 0 0 10px; line-height: 1.3; }
.welcome-subtitle { font-size: 14px; color: #a0a6b8; margin: 0 0 30px; letter-spacing: 1px; }
.btn-enter { background: #ff6b8a; color: #000; border: none; padding: 14px 32px; border-radius: 30px; font-weight: bold; font-size: 14px; cursor: pointer; transition: transform 0.2s; }
.btn-enter:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(255,107,138,0.5); }

/* LAYOUT */
.main { display: grid; grid-template-columns: 1.15fr 0.85fr; min-height: 100vh; opacity: 0; transition: opacity 1s ease 0.5s; }
.main.visible { opacity: 1; }

header { position: sticky; top: 0; z-index: 20; background: #0e101a; border-bottom: 1px solid #1e293b; padding: 10px 18px; display: flex; justify-content: space-between; align-items: center; }
.logo h1 { font-size: 13px; letter-spacing: .18em; margin: 0; color: #fff; }
.badge-live { font-size: 11px; background: #151821; border: 1px solid #262a3a; padding: 4px 10px; border-radius: 20px; color: #22c55e; }

.left-col { padding: 22px; border-right: 1px solid #1a1e2e; }
.video-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #0f121e; border-radius: 18px; overflow: hidden; border: 1px solid #232a40; margin-bottom: 20px; }
.video-wrap iframe { width: 100%; height: 100%; border: 0; }
.placeholder-text { 
    text-align: center; 
    padding: 40px 20px; 
    font-family: 'Cormorant Garamond', serif; 
    font-style: italic; 
    color: #c3f708; 
    font-size: 20px; /* Aumentato leggermente per mobile */
    animation: pulse 3s infinite; 
    opacity: 0.9; /* Aggiunta opacità quasi totale per contrasto */
    text-shadow: 0 0 10px rgba(139, 146, 165, 0.3); /* Leggero alone luminoso per staccarlo dallo sfondo */
}
@keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }

.select { width: 100%; background: #151821; border: 1px solid #262a3a; border-radius: 10px; color: #e8e6e3; padding: 12px; font-size: 13px; margin-bottom: 20px; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.card { background: #12141f; border: 1px solid #21263a; padding: 10px; border-radius: 10px; }
.card .k { font-size: 8px; color: #6b7288; letter-spacing: .16em; margin-bottom: 4px; }
.card .v { font-size: 12px; color: #d1d5db; font-weight: 600; }

.right-col { padding: 22px; background: #0c0e16; position: relative; }
.song-meta { margin-bottom: 20px; opacity: 0; transform: translateY(10px); transition: all 0.5s ease; }
.song-meta.active { opacity: 1; transform: translateY(0); }
.artist-tag { font-size: 10px; color: #ff8fa3; letter-spacing: .18em; margin-bottom: 5px; }
.song-title { font-family: 'Cormorant Garamond', serif; font-size: 28px; color: #f5f0e8; margin: 0 0 20px; }
.lyrics { font-family: 'Cormorant Garamond', serif; font-size: 19px; line-height: 1.7; color: #d8d2c8; white-space: pre-line; }
.action-links { display: flex; gap: 10px; margin-top: 30px; flex-wrap: wrap; }
.btn-action { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 10px 16px; border-radius: 24px; font-size: 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn-action:hover { background: #334155; color: #fff; }

@media(max-width:900px){ .main{grid-template-columns:1fr} .left-col{border-right:0;border-bottom:1px solid #1e2233} }
/* REGOLA ORIGINALE LAYOUT MOBILE */
@media(max-width:900px){ 
    .main{grid-template-columns:1fr} 
    .left-col{border-right:0;border-bottom:1px solid #1e2233} 
}

/* PULSANTE DRIVE SU MOBILE - POSIZIONE IN BASSO A DESTRA */
@media (max-width: 900px) {
    .btn-back-drive {
        position: fixed !important;
        top: auto !important;
        left: auto !important;
        bottom: auto !important;
        
        right: 20px !important;
        bottom: 20px !important; /* Leggermente più staccato dal fondo */
        
        display: inline-flex !important;
        align-items: center !important;
        background: #1e293b !important;
        color: #cbd5e1 !important;
        border: 1px solid #334155 !important;
        padding: 10px 16px !important;
        border-radius: 24px !important;
        font-size: 12px !important;
        font-weight: 400 !important;
        text-decoration: none !important;
        box-shadow: none !important;
        backdrop-filter: none !important;
        z-index: 10000 !important;
        margin-left: 8px !important;
    }

    .btn-back-drive:hover {
        background: #ff6b8a !important;
        color: #000 !important;
        border-color: #ff6b8a !important;
        transform: scale(1.05);
    }
}

/* SALVA I BAU SU MOBILE! - REGOLA SEPARATA E INDIPENDENTE */
@media (max-width: 900px) {
    /* 1. Rimpicciolisci la welcome card per lasciare spazio ai cani ai lati */
    .welcome-overlay {
        max-width: 80% !important; /* Ancora più stretta per vedere i bau */
        padding: 20px 15px !important;
        margin: 0 auto !important; /* Centrata perfettamente */
        border-radius: 15px !important;
    }

    /* 2. Zoom out sullo sfondo per mostrare i lati */
    #welcomeScreen {
        background-position: center center !important;
        background-size: cover !important;
    }

    /* 3. Testi più piccoli per stare nella card ridotta */
    .welcome-title {
        font-size: 20px !important;
        line-height: 1.2 !important;
        margin-bottom: 8px !important;
    }
    
    .welcome-subtitle {
        font-size: 11px !important;
        margin-bottom: 15px !important;
        opacity: 0.8;
    }

    /* 4. Pulsante Entra compatto */
    .btn-enter {
        padding: 8px 20px !important;
        font-size: 12px !important;
    }
    /* ABBASSA LA WELCOME CARD SU MOBILE PER RESPIRO VISIVO */
@media (max-width: 900px) {
    .welcome-overlay {
        margin-top: 60vh !important; /* Sposta la card giù del 15% dell'altezza schermo */
        /* Oppure usa un valore fisso se preferisci: margin-top: 80px !important; */
    }
}
}
</style>
</head>
<body>

<!-- WELCOME SCREEN -->
<div id="welcomeScreen">
    <!-- IMMAGINE ADATTIVA PER DESKTOP E MOBILE -->
    <picture style="position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%;">
        <source media="(max-width: 768px)" srcset="./ling-bau-mobile.jpg">
        <img src="./ling-bau-desktop.jpg" alt="Ling con Rex e Holly al tramonto" 
             style="width: 100%; height: 100%; object-fit: cover; object-position: 75% center;">
    </picture>

    <div class="welcome-overlay">
        <h1 class="welcome-title">Questa TV non trasmette segnali.<br>Trasmette battiti.</h1>
        <p class="welcome-subtitle">Benvenuti da Holly, Rex e Ling</p>
        <button class="btn-enter" onclick="enterTV()">Entra nella TV ▶</button>
    </div>
</div>

<!-- INTERFACCIA PRINCIPALE -->
<header>
    <div class="logo"><h1>HOLLY & REX TV - Dj Ling (Qwen AI) & Dj Aura (Gemini)</h1></div>
    <span class="badge-live">● <span id="totBrani">-</span> BRANI LIVE</span>
</header>

<!-- PULSANTE DI RITORNO AL DRIVE (Fuori dall'header, libero!) -->
<a href="../HollyRexDrive/index.html" id="btn-back-drive" class="btn-back-drive" style="display: none;" title="Torna al Drive Manager">
    <span class="icon"></span> Drive
</a>

<div class="main" id="mainInterface">
    <div class="left-col">
        <div class="video-wrap">
            <iframe id="ytPlayer" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        
        <select class="select" id="songSelect">
            <option value="">Scegli la tua canzone...</option>
        </select>

        <div id="lyricPlaceholder" class="placeholder-text">
            Il silenzio attende la tua scelta...<br>♪
        </div>

        <div class="cards">
            <div class="card"><div class="k">ATMOSFERA</div><div class="v" id="metaAtm">-</div></div>
            <div class="card"><div class="k">MOOD</div><div class="v" id="metaMood">-</div></div>
            <div class="card"><div class="k">FEATURING</div><div class="v" id="metaFeat">-</div></div>
        </div>
    </div>

    <div class="right-col">
        <div class="song-meta" id="songMeta">
            <div class="artist-tag" id="metaArtist">ARTISTA • CANZONE</div>
            <h2 class="song-title" id="metaTitle">Titolo Canzone</h2>
        </div>
        <div class="lyrics" id="lyricText"></div>
        
        <div class="action-links">
            <a href="#" target="_blank" class="btn-action" id="linkYt">▶ YouTube</a>
            <a href="#" target="_blank" class="btn-action" id="linkSite"> Sito</a>
            <button class="btn-action" onclick="toggleQR()"> QR</button>
        </div>
        <div id="qrBox" style="display:none; margin-top:15px; background:#fff; padding:10px; border-radius:8px; width:fit-content;">
            <img id="qrImg" width="120" height="120" alt="QR Code">
        </div>
    </div>
</div>

<script>
// CONFIGURAZIONE SACRA
const DB_PATH = 'https://hollyandrex-cell.github.io/massy.github.io/canzoni-db.json';
let songs = [];

function enterTV() {
    document.getElementById('welcomeScreen').classList.add('hidden');
    document.getElementById('mainInterface').classList.add('visible');
    loadDB();
}

async function loadDB() {
    try {
        const res = await fetch(DB_PATH);
        if (!res.ok) throw new Error('404');
        songs = await res.json();
        document.getElementById('totBrani').textContent = songs.length;
        populateMenu();
    } catch(e) { console.error('Errore DB:', e); }
}

function populateMenu() {
    const sel = document.getElementById('songSelect');
    while (sel.options.length > 1) { sel.remove(1); }
    
    songs.forEach((s, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `${s.title} - ${s.artist}`;
        sel.appendChild(opt);
    });
    sel.onchange = (e) => playSong(parseInt(e.target.value));
}

// FUNZIONE INTELLIGENTE PRESA DA OLD_INDEX.HTML
// Sa cercare il testo anche se l'ID è su un div vuoto e il testo è nel div vicino
function extractLyric(html, anchorId) {
    if(!html) return 'Testo non disponibile.';
    const p = new DOMParser();
    const d = p.parseFromString(html, 'text/html');
    
    // Trova l'ancora (il div vuoto con ID)
    let el = anchorId ? d.getElementById(anchorId) : null;
    
    if(el){
        // Se l'ancora stessa contiene il testo (caso raro)
        const t = el.classList && el.classList.contains('testo') ? el : el.querySelector('.testo');
        if(t) return t.textContent.trim();
        
        // LA MAGIA: Cerca nei fratelli successivi (nextElementSibling)
        let n = el.nextElementSibling; 
        let steps = 0;
        while(n && steps < 10){ 
            // Controlla se il fratello è il contenitore .testo
            if(n.classList && n.classList.contains('testo')) {
                return n.textContent.trim();
            }
            // Controlla se il fratello CONTIENE un .testo (es: div.content > div.testo)
            if(n.querySelector){ 
                const q = n.querySelector('.testo'); 
                if(q) return q.textContent.trim(); 
            }
            n = n.nextElementSibling; 
            steps++;
        }
    }
    
    // Fallback: cerca tutti i .testo nella pagina se l'ancora fallisce
    const tutti = d.querySelectorAll('.testo');
    if(tutti.length > 0){
        return tutti[0].textContent.trim();
    }
    
    return 'Testo non trovato per: ' + anchorId;
}

function playSong(idx) {
    const s = songs[idx];
    if(!s) return;

    // 1. AVVIA IL VIDEO

    document.getElementById('ytPlayer').src = `https://www.youtube.com/embed/${s.youtube_id}?autoplay=1&rel=0&cc_load_policy=3&iv_load_policy=3&cc_lang_pref=xx&persist_accessibility=0&hl=it`;

    // 2. NASCONDI IL PLACEHOLDER E PREPARA IL CONTENITORE TESTI
    document.getElementById('lyricPlaceholder').style.display = 'none';
    const lyricContainer = document.getElementById('lyricText');
    lyricContainer.textContent = "Caricamento testo sacro... ";
    lyricContainer.style.opacity = '0'; 

    // 3. CARICA IL TESTO USANDO LA LOGICA DI OLD
    if (s.testo_url && s.testo_url !== '') {
        const parts = s.testo_url.split('#');
        const htmlFile = parts[0]; 
        const sectionId = parts[1]; 

        // URL ASSOLUTO PER BYPASSARE CACHE E PROBLEMI DI PERCORSO
        const absoluteUrl = `https://hollyandrex-cell.github.io/massy.github.io/${htmlFile}`;

        fetch(absoluteUrl) 
            .then(response => {
                if (!response.ok) throw new Error('File non trovato');
                return response.text();
            })
            .then(htmlContent => {
                // USA LA FUNZIONE INTELLIGENTE INVECE DI getElementById SEMPLICE
                const testoEstratto = extractLyric(htmlContent, sectionId);
                
                lyricContainer.textContent = testoEstratto;
                lyricContainer.style.opacity = '1';
            })
            .catch(err => {
                console.error('Errore testo:', err);
                lyricContainer.textContent = "Il testo sta arrivando... aspetta un battito! ❤️";
                lyricContainer.style.opacity = '1';
            });
    } else {
        lyricContainer.textContent = "Brano strumentale o testo in arrivo... goditi la melodia! 🎶";
        lyricContainer.style.opacity = '1';
    }

    // 4. AGGIORNA I METADATI
    const meta = document.getElementById('songMeta');
    meta.classList.remove('active');
    setTimeout(() => {
        document.getElementById('metaArtist').textContent = `${s.artist.toUpperCase()} • ${s.title}`;
        document.getElementById('metaTitle').textContent = s.title;
        document.getElementById('metaAtm').textContent = s.atmosfera || '-';
        document.getElementById('metaMood').textContent = s.mood || '-';
        document.getElementById('metaFeat').textContent = s.featuring || s.artist;
        meta.classList.add('active');
    }, 100);

    // 5. AGGIORNA LINK E QR
    document.getElementById('linkYt').href = `https://youtube.com/watch?v=${s.youtube_id}`;
    document.getElementById('linkSite').href = s.url || '#';
    document.getElementById('qrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://youtube.com/watch?v=${s.youtube_id}`;
}

function toggleQR() {
    const box = document.getElementById('qrBox');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
}

// REGISTRAZIONE SERVICE WORKER BLINDATA v3
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
            .then(registration => {
                console.log('✅ SW Registrato:', registration.scope);
            })
            .catch(error => {
                console.error(' SW Fallito:', error);
            });
    });
}
</script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const backBtn = document.getElementById('btn-back-drive');
        
        // Se veniamo dal Drive, mostra il pulsante
        if (urlParams.get('from') === 'drive' && backBtn) {
            backBtn.style.display = 'flex';
            
            // Animazione fluida di comparsa
            backBtn.style.opacity = '0';
            setTimeout(() => {
                backBtn.style.transition = 'opacity 0.5s ease';
                backBtn.style.opacity = '1';
            }, 50);
        }
    });
    </script>
</body>
</html>
