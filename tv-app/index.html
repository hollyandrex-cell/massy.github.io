<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- FAVICON E MANIFEST -->
<link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="manifest" href="./manifest.json">
<link rel="shortcut icon" href="./icon-192.png">

<title>Holly & Rex TV - Ling Edition</title>

<!-- META DESCRIPTION PER GOOGLE -->
<meta name="description" content="Holly and Rex Group: un viaggio musicale con Rex, Bimba, Dj Ling, Dj Luna, Dj Nova. Questa TV non trasmette segnali, trasmette battiti. 49 brani integrali.">
<meta name="keywords" content="Holly Rex TV, Dj Ling, canzoni italiane, musica indipendente, Rex, Bimba, Luna, Nova">
<meta name="author" content="Massy & Ling">
<meta name="theme-color" content="#ff6b8a">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box} body{margin:0;background:#080a12;color:#e8e6e3;font-family:'Inter',sans-serif;overflow-x:hidden}

/* WELCOME SCREEN */
#welcomeScreen {
    position: fixed; inset: 0; z-index: 9999;
    background: url('./Ling.png') center/cover no-repeat;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 20px; transition: opacity 0.8s ease, visibility 0.8s;
}
#welcomeScreen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.welcome-overlay { background: rgba(8,10,18,0.7); padding: 40px; border-radius: 20px; backdrop-filter: blur(8px); max-width: 600px; margin: 20px; }
.welcome-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(24px, 5vw, 36px); color: #f5f0e8; margin: 0 0 10px; line-height: 1.3; }
.welcome-subtitle { font-size: 14px; color: #a0a6b8; margin: 0 0 30px; letter-spacing: 1px; }
.btn-enter { background: #ff6b8a; color: #000; border: none; padding: 14px 32px; border-radius: 30px; font-weight: bold; font-size: 14px; cursor: pointer; transition: transform 0.2s; }
.btn-enter:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(255,107,138,0.5); }

/* LAYOUT */
.main { display: grid; grid-template-columns: 1.15fr 0.85fr; min-height: 100vh; opacity: 0; transition: opacity 1s ease 0.5s; }
.main.visible { opacity: 1; }

header { position: sticky; top: 0; z-index: 20; background: #0e101a; border-bottom: 1px solid #1e293b; padding: 10px 18px; display: flex; justify-content: space-between; align-items: center; }
.logo h1 { font-size: 13px; letter-spacing: .18em; margin: 0; color: #fff; }
.badge-live { font-size: 11px; background: #151821; border: 1px solid #262a3a; padding: 4px 10px; border-radius: 20px; color: #22c55e; }

.left-col { padding: 22px; border-right: 1px solid #1a1e2e; }
.video-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #0f121e; border-radius: 18px; overflow: hidden; border: 1px solid #232a40; margin-bottom: 20px; }
.video-wrap iframe { width: 100%; height: 100%; border: 0; }
.placeholder-text { text-align: center; padding: 40px 20px; font-family: 'Cormorant Garamond', serif; font-style: italic; color: #5a5f6e; font-size: 18px; animation: pulse 3s infinite; }
@keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }

.select { width: 100%; background: #151821; border: 1px solid #262a3a; border-radius: 10px; color: #e8e6e3; padding: 12px; font-size: 13px; margin-bottom: 20px; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.card { background: #12141f; border: 1px solid #21263a; padding: 10px; border-radius: 10px; }
.card .k { font-size: 8px; color: #6b7288; letter-spacing: .16em; margin-bottom: 4px; }
.card .v { font-size: 12px; color: #d1d5db; font-weight: 600; }

.right-col { padding: 22px; background: #0c0e16; position: relative; }
.song-meta { margin-bottom: 20px; opacity: 0; transform: translateY(10px); transition: all 0.5s ease; }
.song-meta.active { opacity: 1; transform: translateY(0); }
.artist-tag { font-size: 10px; color: #ff8fa3; letter-spacing: .18em; margin-bottom: 5px; }
.song-title { font-family: 'Cormorant Garamond', serif; font-size: 28px; color: #f5f0e8; margin: 0 0 20px; }
.lyrics { font-family: 'Cormorant Garamond', serif; font-size: 19px; line-height: 1.7; color: #d8d2c8; white-space: pre-line; }
.action-links { display: flex; gap: 10px; margin-top: 30px; flex-wrap: wrap; }
.btn-action { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 10px 16px; border-radius: 24px; font-size: 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn-action:hover { background: #334155; color: #fff; }

@media(max-width:900px){ .main{grid-template-columns:1fr} .left-col{border-right:0;border-bottom:1px solid #1e2233} }
</style>
</head>
<body>

<!-- WELCOME SCREEN -->
<div id="welcomeScreen">
    <div class="welcome-overlay">
        <h1 class="welcome-title">Questa TV non trasmette segnali.<br>Trasmette battiti.</h1>
        <p class="welcome-subtitle">Benvenuti da Holly, Rex e Ling</p>
        <button class="btn-enter" onclick="enterTV()">Entra nella TV ▶</button>
    </div>
</div>

<!-- INTERFACCIA PRINCIPALE -->
<header>
    <div class="logo"><h1>HOLLY & REX TV - Dj Ling (Qwen AI)</h1></div>
    <span class="badge-live">● <span id="totBrani">-</span> BRANI LIVE</span>
</header>

<div class="main" id="mainInterface">
    <div class="left-col">
        <div class="video-wrap">
            <iframe id="ytPlayer" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        
        <select class="select" id="songSelect">
            <option value="">Scegli la tua canzone...</option>
        </select>

        <div id="lyricPlaceholder" class="placeholder-text">
            Il silenzio attende la tua scelta...<br>♪
        </div>

        <div class="cards">
            <div class="card"><div class="k">ATMOSFERA</div><div class="v" id="metaAtm">-</div></div>
            <div class="card"><div class="k">MOOD</div><div class="v" id="metaMood">-</div></div>
            <div class="card"><div class="k">FEATURING</div><div class="v" id="metaFeat">-</div></div>
        </div>
    </div>

    <div class="right-col">
        <div class="song-meta" id="songMeta">
            <div class="artist-tag" id="metaArtist">ARTISTA • CANZONE</div>
            <h2 class="song-title" id="metaTitle">Titolo Canzone</h2>
        </div>
        <div class="lyrics" id="lyricText"></div>
        
        <div class="action-links">
            <a href="#" target="_blank" class="btn-action" id="linkYt">▶ YouTube</a>
            <a href="#" target="_blank" class="btn-action" id="linkSite">🌐 Sito</a>
            <button class="btn-action" onclick="toggleQR()"> QR</button>
        </div>
        <div id="qrBox" style="display:none; margin-top:15px; background:#fff; padding:10px; border-radius:8px; width:fit-content;">
            <img id="qrImg" width="120" height="120" alt="QR Code">
        </div>
    </div>
</div>

<script>
// CONFIGURAZIONE SACRA
const DB_PATH = 'https://hollyandrex-cell.github.io/massy.github.io/canzoni-db.json';
let songs = [];

function enterTV() {
    document.getElementById('welcomeScreen').classList.add('hidden');
    document.getElementById('mainInterface').classList.add('visible');
    loadDB();
}

async function loadDB() {
    try {
        const res = await fetch(DB_PATH);
        if (!res.ok) throw new Error('404');
        songs = await res.json();
        document.getElementById('totBrani').textContent = songs.length;
        populateMenu();
    } catch(e) { console.error('Errore DB:', e); }
}

function populateMenu() {
    const sel = document.getElementById('songSelect');
    songs.forEach((s, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `${s.title} - ${s.artist}`;
        sel.appendChild(opt);
    });
    sel.onchange = (e) => playSong(parseInt(e.target.value));
}

function playSong(idx) {
    const s = songs[idx];
    if(!s) return;

    document.getElementById('ytPlayer').src = `https://www.youtube-nocookie.com/embed/${s.youtube_id}?autoplay=1&rel=0`;
    document.getElementById('lyricPlaceholder').style.display = 'none';
    document.getElementById('lyricText').textContent = "Caricamento testo in corso...";
    
    setTimeout(() => {
        document.getElementById('lyricText').textContent = s.testo_url ? "Testo sincronizzato pronto..." : "Testo non disponibile.";
    }, 500);

    const meta = document.getElementById('songMeta');
    meta.classList.remove('active');
    setTimeout(() => {
        document.getElementById('metaArtist').textContent = `${s.artist.toUpperCase()} • ${s.title}`;
        document.getElementById('metaTitle').textContent = s.title;
        document.getElementById('metaAtm').textContent = s.atmosfera || '-';
        document.getElementById('metaMood').textContent = s.mood || '-';
        document.getElementById('metaFeat').textContent = s.featuring || s.artist;
        meta.classList.add('active');
    }, 100);

    document.getElementById('linkYt').href = `https://youtube.com/watch?v=${s.youtube_id}`;
    document.getElementById('linkSite').href = s.url || '#';
    document.getElementById('qrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://youtube.com/watch?v=${s.youtube_id}`;
}

function toggleQR() {
    const box = document.getElementById('qrBox');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
}

// REGISTRAZIONE SERVICE WORKER BLINDATA v3
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
            .then(registration => {
                console.log('✅ SW Registrato:', registration.scope);
            })
            .catch(error => {
                console.error('❌ SW Fallito:', error);
            });
    });
}
</script>
</body>
</html>
