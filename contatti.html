  <style>
    /* --- RESET DEL LAYOUT --- */
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      position: relative;
      background: var(--blu-notte);
    }

    /* --- VIDEO DI SFOUNDO --- */
    .background-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    /* --- CONTENUTO CENTRATO --- */
    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 0 20px;
      max-width: 700px;
      margin: 0 auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: var(--oro);
      text-shadow: 0 0 15px rgba(248, 213, 158, 0.7);
      letter-spacing: 2px;
      margin-bottom: 40px;
      font-size: 2.8rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 25px;
      max-width: 500px;
    }

    .link-item {
      color: var(--oro);
      text-decoration: none;
      font-size: 1.3rem;
      transition: all 0.3s ease;
      text-shadow: 0 0 8px rgba(248, 213, 158, 0.5);
    }

    .link-item:hover {
      color: var(--oro-hover);
      text-shadow: 0 0 15px rgba(255, 235, 59, 0.8);
      transform: translateX(5px);
    }

    .signature {
      margin-top: 60px;
      font-style: italic;
      opacity: 0.8;
      color: var(--oro);
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
