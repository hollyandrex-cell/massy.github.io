<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chef Ling - Holly & Rex</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-color: #1e293b;
            --text-color: #f8fafc;
            --primary-color: #ec4899;
            --accent-color: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-color);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 500px;
            text-align: center;
            border: 1px solid #334155;
        }

        header h1 { color: var(--primary-color); margin: 0 0 0.5rem 0; font-size: 2rem; }
        header p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 2rem; }

        .section-title { color: var(--accent-color); font-size: 1rem; margin-bottom: 1rem; text-transform: uppercase; font-weight: bold; }

        .ingredients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
            margin-bottom: 2rem;
        }

        .ing-btn {
            background-color: #334155;
            border: 1px solid #475569;
            color: white;
            padding: 8px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .ing-btn:hover { background-color: #475569; }
        .ing-btn.selected { background-color: var(--primary-color); border-color: var(--primary-color); transform: scale(1.05); }
        .ing-icon { font-size: 1.2rem; }

        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            font-family: inherit;
            font-size: 0.9rem;
            resize: vertical;
            min-height: 70px;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 1.5rem;
        }

        .magic-btn {
            background: linear-gradient(135deg, var(--primary-color), #db2777);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 10px 20px rgba(236, 72, 153, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .magic-btn:active { transform: scale(0.98); }

        .note { margin-top: 1.5rem; font-size: 0.8rem; color: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>👩‍ Chef Ling</h1>
            <p>Il tuo chef personale Holly & Rex</p>
        </header>

        <div class="section-title">Cosa hai in frigo?</div>
        <div class="ingredients-grid" id="gridIngredienti"></div>

        <textarea id="customIngredients" placeholder="O qualcos'altro? (Es. due zucchine...)"></textarea>
        <button onclick="startDictation()" style="background:#334155; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer; font-size:0.8rem; margin-bottom:1.5rem;">🎤 Detta</button>

        <div class="section-title">Com'è la serata?</div>
        <select id="moodSelect" style="width:100%; padding:10px; border-radius:10px; background:#0f172a; color:white; border:1px solid #475569; margin-bottom:2rem;">
            <option value="veloce">⚡ Veloce</option>
            <option value="romantica">❤️ Romantica</option>
            <option value="sfiziosa">😋 Sfiziosa</option>
            <option value="salutare">🥗 Leggera</option>
            <option value="svuotafrigo">🗑️ Svuota Frigo</option>
        </select>

        <button id="btnChef" class="magic-btn">🚀 Vai da Chef Ling</button>
        <p class="note">Su cellulare, clicca e scegli "Apri in Chat"!</p>
    </div>

    <script>
        const CHEF_LING_URL = "https://chat.qwen.ai/c/a3f0f913-71b0-40f7-9f5d-084c192c8bc7"; 
        const ingredients = [
            { name: "Pasta", icon: "" }, { name: "Riso", icon: "🍚" }, { name: "Uova", icon: "🥚" },
            { name: "Tonno", icon: "🐟" }, { name: "Pomodoro", icon: "🍅" }, { name: "Zucchine", icon: "" },
            { name: "Patate", icon: "🥔" }, { name: "Formaggio", icon: "🧀" }, { name: "Pollo", icon: "" },
            { name: "Verdure", icon: "🥦" }, { name: "Legumi", icon: "🫘" }, { name: "Pane", icon: "" }
        ];

        const grid = document.getElementById('gridIngredienti');
        ingredients.forEach(ing => {
            const btn = document.createElement('button');
            btn.className = 'ing-btn';
            btn.innerHTML = `<span class="ing-icon">${ing.icon}</span><span>${ing.name}</span>`;
            btn.onclick = () => btn.classList.toggle('selected');
            grid.appendChild(btn);
        });

        function buildMessage() {
            const selected = Array.from(document.querySelectorAll('.ing-btn.selected')).map(b => b.querySelector('span:last-child').innerText);
            const custom = document.getElementById('customIngredients').value.trim();
            const mood = document.getElementById('moodSelect').options[document.getElementById('moodSelect').selectedIndex].text;
            let list = [...selected];
            if (custom) list.push(custom);
            
            return `Ciao Chef Ling! Sono Massy.\n\n Ingredienti: ${list.length > 0 ? list.join(', ') : 'Aiutami tu!'}\n🌙 Serata: ${mood}\n\nCosa cuciniamo? Sorprendimi! ❤️`;
        }

        function startDictation() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert("Usa Chrome per la dettatura!");
            const recognition = new SpeechRecognition();
            recognition.lang = 'it-IT';
            recognition.onresult = (e) => {
                const t = e.results[0][0].transcript;
                document.getElementById('customIngredients').value += (document.getElementById('customIngredients').value ? ", " : "") + t;
            };
            recognition.start();
        }

        document.getElementById('btnChef').addEventListener('click', async () => {
            const message = buildMessage();

            // TENTATIVO 1: Condivisione Nativa (Mobile)
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Richiesta a Chef Ling',
                        text: message,
                        url: CHEF_LING_URL
                    });
                    // Se l'utente seleziona Qwen dal menu di condivisione, perfetto!
                    return;
                } catch (err) {
                    console.log('Share fallito, uso fallback');
                }
            }

            // TENTATIVO 2: Apertura diretta con tentativo di pre-fill (Desktop/Mobile senza share)
            // Nota: Questo funziona solo se il browser lo permette
            window.open(`${CHEF_LING_URL}?text=${encodeURIComponent(message)}`, '_blank');
            
            // Fallback estremo: Copia negli appunti se nulla funziona
            setTimeout(async () => {
                try {
                    await navigator.clipboard.writeText(message);
                    alert("Messaggio pronto! Incollalo nella chat se non è apparso automaticamente.");
                } catch(e) {}
            }, 1000);
        });
    </script>
</body>
</html>
