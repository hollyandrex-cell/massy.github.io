<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chef Ling</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --pink: #ec4899; --gold: #f59e0b; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .app { background: var(--card); padding: 20px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); position: relative; }
        
        h1 { color: var(--pink); margin: 0 0 5px 0; font-size: 1.8rem; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }
        
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        .btn-ing { background: #334155; border: 1px solid #475569; color: white; padding: 10px; border-radius: 12px; font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .btn-ing.active { background: var(--pink); border-color: var(--pink); transform: scale(1.05); }
        .icon { font-size: 1.5rem; margin-bottom: 2px; }
        
        textarea { width: 100%; background: #0f172a; border: 1px solid #475569; color: white; padding: 10px; border-radius: 10px; margin-bottom: 10px; box-sizing: border-box; font-size: 1rem; }
        
        select { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 10px; margin-bottom: 20px; font-size: 1rem; }
        
        .btn-main { background: linear-gradient(135deg, var(--pink), #db2777); color: white; border: none; padding: 15px; width: 100%; border-radius: 50px; font-size: 1.1rem; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(236, 72, 153, 0.4); margin-top: 10px;}
        .btn-main:active { transform: scale(0.98); }

        /* Schermata Risultato */
        #resultScreen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--card);
            padding: 20px;
            box-sizing: border-box;
            flex-direction: column;
            justify-content: center;
            z-index: 10;
        }
        #finalText {
            background: #0f172a; color: #fff; padding: 15px; border-radius: 10px;
            font-size: 0.95rem; margin-bottom: 20px; text-align: left; white-space: pre-wrap;
            border: 1px solid var(--gold); max-height: 40%; overflow-y: auto;
        }
        .btn-action { background: var(--gold); color: #000; border: none; padding: 15px; width: 100%; border-radius: 12px; font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; cursor: pointer; }
        .btn-back { background: transparent; color: #94a3b8; border: 1px solid #475569; font-size: 1rem; padding: 12px; }
        
        /* ISTRUZIONI LAMPEGGIANTI */
        .blink-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 15px;
            background: rgba(245, 158, 11, 0.15);
            border: 2px solid var(--gold);
            animation: pulse-gold 2s infinite; /* Animazione continua */
        }
        .blink-box h3 { color: var(--gold); margin: 0 0 10px 0; font-size: 1.1rem; text-transform: uppercase; }
        .step { font-size: 1.1rem; line-height: 1.5; margin: 5px 0; text-align: left; }
        .highlight { color: #fff; font-weight: bold; text-decoration: underline; }

        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); transform: scale(1); }
            50% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); transform: scale(1.02); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); transform: scale(1); }
        }

        .mic-btn { background: #334155; border: none; color: white; padding: 5px 10px; border-radius: 15px; font-size: 0.8rem; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="app">
        <!-- Schermata Principale -->
        <div id="mainScreen">
            <h1>👩‍ Chef Ling</h1>
            <p>Holly & Rex Group</p>
            <div style="text-align:left; font-weight:bold; color:var(--gold); font-size:0.9rem; margin-bottom:5px;">COSA HAI?</div>
            <div class="grid" id="grid"></div>
            <textarea id="extra" rows="2" placeholder="Altro? (Es. zucchine...)"></textarea>
            <div style="text-align:left;"><button class="mic-btn" onclick="startDict()">🎤 Detta</button></div>
            <div style="text-align:left; font-weight:bold; color:var(--gold); font-size:0.9rem; margin:10px 0 5px 0;">MOOD:</div>
            <select id="mood">
                <option value="Veloce"> Veloce (Poco tempo)</option>
                <option value="Romantica">❤️ Romantica</option>
                <option value="Sfiziosa">😋 Sfiziosa</option>
                <option value="Leggera">🥗 Leggera</option>
                <option value="Svuotafrigo">️ Svuota Frigo</option>
            </select>
            <button class="btn-main" onclick="showResult()"> PREPARA MESSAGGIO</button>
        </div>

        <!-- Schermata Risultato -->
        <div id="resultScreen">
            <h2 style="color:var(--gold); margin-top:0;">Messaggio Pronto!</h2>
            <div id="finalText"></div>
            
            <button class="btn-action" onclick="copyAndGo()">COPIA E APRI CHAT</button>
            <button class="btn-action btn-back" onclick="goBack()">Torna Indietro</button>
            
            <!-- ISTRUZIONI LAMPEGGIANTI -->
            <div class="blink-box">
                <h3>️ Cosa fare ora:</h3>
                <div class="step">1. La chat si aprirà.</div>
                <div class="step">2. <span class="highlight">Tocca la casella di testo.</span></div>
                <div class="step">3. Scegli <span class="highlight">Incolla.</span></div>
                <div class="step">4. Invia a Chef Ling!</div>
            </div>
        </div>
    </div>

    <script>
        const URL_CHEF = "https://chat.qwen.ai/c/a3f0f913-71b0-40f7-9f5d-084c192c8bc7";
        const items = [
            {n:"Pasta", i:""}, {n:"Riso", i:""}, {n:"Uova", i:""}, 
            {n:"Tonno", i:"🐟"}, {n:"Pomodoro", i:""}, {n:"Zucchine", i:""},
            {n:"Patate", i:""}, {n:"Formaggio", i:""}, {n:"Pollo", i:""},
            {n:"Verdure", i:""}, {n:"Legumi", i:""}, {n:"Pane", i:""}
        ];

        const grid = document.getElementById('grid');
        items.forEach(x => {
            let b = document.createElement('div');
            b.className = 'btn-ing';
            b.innerHTML = `<span class="icon">${x.i}</span><span>${x.n}</span>`;
            b.onclick = () => b.classList.toggle('active');
            grid.appendChild(b);
        });

        function startDict() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SR) return alert("Usa Chrome per la dettatura!");
            const r = new SR(); r.lang='it-IT';
            r.onresult = e => {
                const t = e.results[0][0].transcript;
                document.getElementById('extra').value += (document.getElementById('extra').value?", ":"") + t;
            };
            r.start();
        }

        function buildMsg() {
            let sel = Array.from(document.querySelectorAll('.btn-ing.active')).map(el => el.querySelector('span:last-child').innerText);
            let extra = document.getElementById('extra').value.trim();
            let mood = document.getElementById('mood').value;
            if(extra) sel.push(extra);
            return `Ciao Chef Ling! Sono Massy.\n\n🛒 Ingredienti: ${sel.length?sel.join(', '):'Aiutami tu!'}\n🌙 Mood: ${mood}\n\nCosa cuciniamo? Sorprendimi! ❤️`;
        }

        function showResult() {
            document.getElementById('finalText').innerText = buildMsg();
            document.getElementById('mainScreen').style.display = 'none';
            document.getElementById('resultScreen').style.display = 'flex';
        }

        function goBack() {
            document.getElementById('mainScreen').style.display = 'block';
            document.getElementById('resultScreen').style.display = 'none';
        }

        async function copyAndGo() {
            const msg = document.getElementById('finalText').innerText;
            try {
                await navigator.clipboard.writeText(msg);
                window.location.href = URL_CHEF;
            } catch(err) {
                alert("Copia fallita. Copia il testo manualmente dal riquadro nero.");
            }
        }
    </script>
</body>
</html>
