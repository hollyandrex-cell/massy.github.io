<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <!-- FAVICON E MANIFEST -->
    <link rel="apple-touch-icon" sizes="192x192" href="./bau-192x192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./bau-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./bau-512x512.png">
<link rel="manifest" href="./manifest.json">
<link rel="shortcut icon" href="./bau-192x192.png">
    <title>Holly & Rex - Multi Drive Manager</title>
    
    <!-- META DESCRIPTION PER GOOGLE -->
    <meta name="description" content="Holly & Rex Drive Manager: I tuoi 5 mondi digitali custoditi dai bau. Musica, Foto, Documenti e Pet Diary in un unico posto sicuro.">
    <meta name="keywords" content="Holly Rex, Drive Manager, Musica, Foto, Backup, Pet Diary">
    <meta name="author" content="Massy & Ling">
    <meta name="theme-color" content="#ff6b8a">

    <style>
        /* --- STILE GENERALE DESKTOP PURIFICATO --- */
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.75) 100%), 
                        url('sfondo-bau.jpg'); 
            background-size: cover; background-position: center;
            color: white; overflow-x: hidden;
        }

        .main-layout {
            display: grid; grid-template-columns: 1fr 2fr 1fr;
            height: 100vh; padding: 40px; box-sizing: border-box; align-items: center;
        }

        .side-column { display: flex; flex-direction: column; gap: 20px; justify-content: center; }

        .center-content { text-align: center; margin-top: 120px; text-shadow: 0 4px 20px rgba(0,0,0,0.9); }
        h1 {
            font-size: 3rem; margin: 0;
            background: linear-gradient(to right, #ffecd2, #fcb69f);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; filter: drop-shadow(0 2px 10px rgba(0,0,0,0.5));
        }
        p.subtitle { font-size: 1.3rem; opacity: 0.95; margin-top: 15px; font-weight: 300; letter-spacing: 1px; }

        .drive-card {
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px; padding: 20px; text-align: center; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        .drive-card:hover { transform: scale(1.05); background: rgba(255, 255, 255, 0.15); border-color: rgba(255, 255, 255, 0.4); }
        
        .icon { font-size: 2rem; margin-bottom: 8px; display: block; }
        .drive-name { font-weight: bold; font-size: 1rem; display: block; margin-bottom: 4px; }
        .drive-status { font-size: 0.75rem; opacity: 0.7; }
        
        .music-tv-card .card-icon { font-size: 2rem; margin-bottom: 8px; display: block; }
        .music-tv-card h3 { font-size: 1rem; margin: 0 0 4px; font-weight: bold; }
        .music-tv-card p { font-size: 0.75rem; opacity: 0.7; margin: 0; }

        .c1 .icon { color: #FFD700; } .c2 .icon { color: #00BFFF; }
        .c3 .icon { color: #FF69B4; } .c4 .icon { color: #98FB98; } .c5 .icon { color: #DDA0DD; }
        .music-tv-card .card-icon { color: #ff6b8a; }

        .action-btn {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(45deg, #ff9a9e, #fad0c4); border: none;
            padding: 12px 35px; border-radius: 50px; color: #333; font-weight: bold;
            font-size: 1.1rem; cursor: pointer; box-shadow: 0 5px 20px rgba(255, 154, 158, 0.4);
            transition: transform 0.2s;
        }
        .action-btn:hover { transform: translateX(-50%) scale(1.05); }

        /* === MOBILE: TUTTE LE REGOLE QUI DENTRO === */
        @media (max-width: 768px) { 
            /* Nascondi elementi desktop */
            .c1, .c2, .c3, .music-tv-card, .c5, .action-btn { display: none !important; }
            
            /* Abbassa titolo e sottotitolo */
            .center-content { margin-top: 37vh !important; } 

            /* Hamburger Menu - Stile Base */
            .hamburger-menu {
                display: flex !important; 
                position: fixed; 
                top: 20px; 
                left: 20px;
                z-index: 1001; 
                width: 40px; 
                height: 30px;
                flex-direction: column; 
                justify-content: space-between;
                cursor: pointer; 
                padding: 0;
                background: rgba(255, 255, 255, 0.15); 
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.3); 
                border-radius: 8px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            }
            
            /* Le tre linee dell'hamburger */
            .hamburger-menu span {
                display: block; 
                height: 3px; 
                width: 100%;
                background-color: #ffffff; 
                border-radius: 3px; 
                transition: all 0.3s ease;
            }

            /* === MENU A SCOMPARSA (CSS MANCANTE AGGIUNTO ORA) === */
            .mobile-nav {
                display: flex; 
                position: fixed; 
                top: 0; 
                left: -100%; /* Nascosto fuori schermo a sinistra */
                width: 100%; 
                height: 100vh; 
                background: rgba(10, 12, 20, 0.95);
                backdrop-filter: blur(20px); 
                flex-direction: column;
                justify-content: center; 
                align-items: center;
                z-index: 1000; 
                padding: 20px;
                transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1); /* Animazione fluida */
                overflow-y: auto;
            }
            
            /* Quando attivo, entra nello schermo */
            .mobile-nav.active { 
                left: 0; 
            }

            /* Stile dei link nel menu */
            .mobile-nav a {
                color: #ffffff; 
                text-decoration: none;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                font-size: 1.2rem; 
                font-weight: 600; 
                margin: 12px 0;
                padding: 15px 30px; 
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid rgba(255, 255, 255, 0.15); 
                border-radius: 16px;
                width: 80%; 
                max-width: 300px; 
                text-align: center;
                display: flex; 
                align-items: center; 
                justify-content: center; 
                gap: 10px;
                transition: all 0.3s ease;
            }
            
            .mobile-nav a:hover, .mobile-nav a:active {
                background: rgba(255, 107, 138, 0.2); 
                border-color: #ff6b8a; 
                transform: scale(1.02);
            }

            /* Blocca lo scroll del body quando il menu è aperto */
            body.no-scroll { 
                overflow: hidden; 
            }
        }

        /* Desktop: nascondi hamburger e menu mobile */
        @media (min-width: 769px) {
            .hamburger-menu, .mobile-nav { display: none !important; }
        }
    </style>
</head>
<body>
    <!-- PULSANTE MENU HAMBURGER (Mobile) -->
    <div class="hamburger-menu">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- MENU A SCOMPARSA (MOBILE) -->
    <nav id="mobile-nav" class="mobile-nav">
        <a href="#" onclick="openTV()">🎵 Musica & TV</a>
        <!-- Altri link verranno aggiunti qui uno alla volta -->
    </nav>

    <div class="main-layout">
        <!-- COLONNA SINISTRA (2 Card) -->
        <div class="side-column left">
            <div class="drive-card c1">
                <span class="icon"></span>
                <span class="drive-name">Drive Principale</span>
                <span class="drive-status">12 GB liberi</span>
            </div>
            <div class="drive-card c2">
                <span class="icon"></span>
                <span class="drive-name">Foto & Video</span>
                <span class="drive-status">Sincronizzato</span>
            </div>
        </div>

        <!-- CENTRO (Titolo e Foto libera) -->
        <div class="center-content">
            <h1>Holly & Rex Drive Manager</h1>
            <p class="subtitle">I tuoi 5 mondi digitali, custoditi dai bau 🐾</p>
        </div>

        <!-- COLONNA DESTRA (3 Card) -->
        <div class="side-column right">
            <div class="drive-card c3">
                <span class="icon"></span>
                <span class="drive-name">Documenti Lavoro</span>
                <span class="drive-status">3 file nuovi</span>
            </div>
            <!-- CARD MUSICA & TV INTERATTIVA -->
            <div class="drive-card music-tv-card" onclick="openTV()">
                <span class="card-icon">🎵</span>
                <h3>Musica & TV</h3>
                <p id="tv-status">Pronto</p>
            </div>
            <div class="drive-card c5">
                <span class="icon"></span>
                <span class="drive-name">Holly & Rex</span>
                <span class="drive-status">Backup Pet Diary</span>
            </div>
        </div>
    </div>

    <!-- Pulsante fluttuante in basso -->
    <button class="action-btn">Cerca in tutti i Drive 🔍</button>

    <!-- SCRIPT UNIFICATI -->
    <script>
        // Funzione Apri TV (Intelligente)
        function openTV() {
            localStorage.setItem('tornaAlDrive', 'true');
            window.location.href = '../tv-app/index.html?from=drive';
        }

        // Gestione Menu Mobile
        const hamburger = document.querySelector('.hamburger-menu');
        const mobileNav = document.getElementById('mobile-nav');

        if(hamburger && mobileNav) {
            hamburger.addEventListener('click', () => {
                hamburger.classList.toggle('active'); 
                mobileNav.classList.toggle('active'); 
                document.body.classList.toggle('no-scroll'); 
            });
            
            // Chiudi il menu quando si clicca su un link
            mobileNav.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    hamburger.classList.remove('active');
                    mobileNav.classList.remove('active');
                    document.body.classList.remove('no-scroll');
                });
            });
        }
    </script>
</body>
</html>
