<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ripristina v2</title>
<style>body{font-family:sans-serif;background:#0f172a;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px} .box{background:#1e293b;padding:2rem;border-radius:16px;max-width:500px;width:100%;border:1px solid #334155} button{padding:14px 20px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;background:#22c55e;color:#fff;width:100%;margin-top:12px;font-size:1rem} button.login{background:#3b82f6} input{width:100%;padding:10px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff;box-sizing:border-box} #log{background:#0f172a;padding:12px;border-radius:8px;margin-top:15px;max-height:300px;overflow:auto;font-size:0.8rem;white-space:pre-wrap;border:1px solid #334155}</style>
</head><body>
<div class="box">
<h2 style="color:#fbbf24;margin-top:0">🆘 Ripristino v2 - Senza Popup</h2>
<p id="status" style="color:#94a3b8">Apro... se non sei loggato ti faccio loggare automaticamente</p>
<input type="file" id="file" accept=".json" style="margin-top:15px">
<button id="btn">💾 CARICA E FORZA SALVATAGGIO</button>
<div id="log"></div>
</div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, doc, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const firebaseConfig = {
  apiKey: "AIzaSyAR8NVxtUu5QhlDWd0DXjp1lWV6vLdRM1c",
  authDomain: "holly-rex-spesa.firebaseapp.com",
  projectId: "holly-rex-spesa",
  storageBucket: "holly-rex-spesa.firebasestorage.app",
  messagingSenderId: "450072023944",
  appId: "1:450072023944:web:888af5555a5b50c599203d"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');
function log(t){ logEl.textContent += t+"\n"; console.log(t); }

// Gestisci ritorno da redirect
getRedirectResult(auth).then(res=>{
  if(res) log("✅ Ritorno da login: "+res.user.email);
}).catch(e=>log("Errore redirect: "+e.message));

let user=null;
onAuthStateChanged(auth, u=>{
  if(u){
    user=u;
    statusEl.innerHTML="✅ Loggato come <strong style='color:#4ade80'>"+u.email+"</strong><br>Ora carica il file JSON e tappa il bottone verde";
    log("Loggato: "+u.email);
  } else {
    statusEl.innerHTML="Non loggato, ti porto al login Google...<br><small>Se non si apre, tappa qui sotto</small><br><button class='login' onclick='doLogin()'>🔐 LOGIN CON GOOGLE</button>";
    // Auto-login dopo 1 sec
    setTimeout(()=>{ if(!auth.currentUser) doLogin(); }, 1000);
  }
});
window.doLogin=()=>signInWithRedirect(auth, provider);

let backup=null;
document.getElementById('file').onchange=e=>{
  const f=e.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    try{ backup=JSON.parse(ev.target.result); log("📂 Backup letto: "+backup.lista.length+" articoli"); backup.lista.forEach((it,i)=>log((i+1)+". "+it.nome+" "+(it.qta||""))); }catch(err){ log("❌ ERRORE JSON: "+err); }
  };
  r.readAsText(f);
};
document.getElementById('btn').onclick=async()=>{
  if(!user){ alert("Non sei loggato! Tappa LOGIN"); return; }
  if(!backup){ alert("Carica prima il file JSON di ieri!"); return; }
  try{
    const docRef = doc(db, 'liste', 'holly-rex-condivisa');
    log("⏳ Scrivo su Firestore...");
    await setDoc(docRef, { items: backup.lista, note: backup.nota||backup.note||"", ultimoAggiornamento: new Date().toISOString() });
    log("✅ SCRITTURA RIUSCITA!");
    const check = await getDoc(docRef);
    log("✅ Verifica Firestore: "+check.data().items.length+" articoli salvati");
    log("🎉 FATTO! Ora apri spesa.html normale con ?v=999 e fai CTRL+F5");
    alert("✅ Lista ripristinata! "+check.data().items.length+" articoli tornati!");
  }catch(err){ log("❌ ERRORE: "+err.message+"\n"+err.stack); alert("Errore: "+err.message); }
};
</script>
</body></html>
