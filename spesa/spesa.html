<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0f172a">
<title>Lista della Spesa - Holly & Rex</title>
<link rel="manifest" href="manifest.json">
<style>
/* Holly & Rex Group - Design identico originale 784 righe */
* { box-sizing: border-box; margin:0; padding:0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
  background: radial-gradient(ellipse at top, #1e293b 0%, #0f172a 100%);
  color: #f1f5f9;
  display:flex; justify-content:center; padding:16px; margin:0;
  min-height:100vh; -webkit-font-smoothing: antialiased;
}
.card {
  background: linear-gradient(180deg, #1e293b 0%, #1e293b 100%);
  padding:24px 20px; border-radius:24px; max-width:500px; width:100%;
  border:1px solid #334155; box-shadow: 0 20px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
  align-self: flex-start;
}
h1 {
  color:#fbbf24; text-align:center; margin:0 0 6px; font-size:1.9rem; font-weight:800;
  letter-spacing:-.02em; text-shadow:0 2px 10px rgba(251,191,36,.3);
}
.sub { color:#94a3b8; text-align:center; font-size:.85rem; margin-bottom:18px; font-weight:500; }
.user {
  display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:18px;
  background:#0f172a; padding:8px 12px; border-radius:12px; border:1px solid #1e293b;
}
.user img{width:26px;height:26px;border-radius:50%; border:2px solid #334155}
.user span{color:#cbd5e1; font-size:.85rem; font-weight:500}
.inputs{ display:flex; gap:8px; margin-bottom:10px; }
input {
  flex:1; padding:14px 14px; border-radius:12px; border:1.5px solid #475569;
  background:#0f172a; color:#fff; outline:none; font-size:.95rem; transition:.2s;
}
input::placeholder{ color:#64748b; }
input:focus{ border-color:#fbbf24; box-shadow:0 0 0 3px rgba(251,191,36,.15); background:#0f172a; }
#inpQta{ max-width:115px; }
.suggestions{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px; min-height:0; }
.chip{
  background:#0f172a; border:1.5px solid #fbbf24; color:#fbbf24;
  padding:7px 12px; border-radius:20px; font-size:.82rem; cursor:pointer; font-weight:600;
  transition:.2s; animation: pop .3s ease;
}
.chip:hover{ background:#fbbf24; color:#0f172a; transform: scale(1.05); }
.chip-generic{ border-color:#64748b; color:#94a3b8; }
.chip-generic:hover{ background:#334155; color:#fff; border-color:#94a3b8; }
@keyframes pop { 0%{transform:scale(.8); opacity:0} 100%{transform:scale(1); opacity:1} }
.btns{ display:flex; gap:10px; margin-bottom:18px; }
button{
  flex:1; padding:14px; border:none; border-radius:12px; font-weight:700; cursor:pointer;
  font-size:.92rem; transition:.2s; letter-spacing:.01em;
}
button:active{ transform: scale(.97); }
.btn-add{ background: linear-gradient(135deg, #6366f1, #4f46e5); color:#fff; box-shadow:0 4px 15px rgba(99,102,241,.3); }
.btn-add:hover{ box-shadow:0 6px 20px rgba(99,102,241,.4); }
.btn-voice{ background: linear-gradient(135deg, #ec4899, #db2777); color:#fff; box-shadow:0 4px 15px rgba(236,72,153,.3); }
.list{
  max-height:460px; overflow:auto; display:flex; flex-direction:column; gap:9px; margin-bottom:18px;
  padding-right:4px; scrollbar-width: thin; scrollbar-color: #334155 transparent;
}
.list::-webkit-scrollbar{ width:6px; }
.list::-webkit-scrollbar-thumb{ background:#334155; border-radius:10px; }
.item{
  background: linear-gradient(135deg, #334155, #2d3748); padding:13px 14px; border-radius:14px;
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  border:1px solid #3f4a5c; animation: slideIn .3s ease; position:relative;
}
@keyframes slideIn{ from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
.item-left{ display:flex; flex-direction:column; gap:4px; flex:1; min-width:0; }
.item-name{ font-weight:700; font-size:.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.badge-price{
  background: linear-gradient(135deg, #22c55e, #16a34a); color:#fff; font-size:.73rem;
  padding:3px 8px; border-radius:7px; margin-left:7px; font-weight:800; vertical-align:middle;
  box-shadow:0 2px 6px rgba(34,197,94,.3);
}
.badge-old{
  background:#0f172a; color:#94a3b8; font-size:.72rem; padding:4px 8px; border-radius:8px;
  border:1px solid #1e293b; display:inline-flex; align-items:center; gap:4px; width:fit-content; max-width:100%;
}
.item-actions{ display:flex; gap:7px; align-items:center; flex-shrink:0; }
.btn-price{
  background: linear-gradient(135deg, #22c55e, #16a34a); color:#fff; border:none; padding:7px 12px;
  border-radius:9px; cursor:pointer; font-size:.82rem; font-weight:800; min-width:38px;
  box-shadow:0 2px 8px rgba(34,197,94,.3);
}
.btn-del{
  background:#1e293b; color:#ef4444; border:1px solid #334155; font-size:1.1rem;
  width:36px; height:36px; border-radius:9px; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.btn-del:hover{ background:#ef4444; color:#fff; }
.note-label{ font-size:.82rem; color:#94a3b8; margin-bottom:6px; display:flex; align-items:center; gap:6px; font-weight:600; }
textarea{
  width:100%; padding:12px; border-radius:12px; border:1.5px solid #475569; background:#0f172a;
  color:#fff; min-height:80px; box-sizing:border-box; font-family:inherit; font-size:.9rem; resize:vertical;
}
textarea:focus{ border-color:#fbbf24; outline:none; box-shadow:0 0 0 3px rgba(251,191,36,.15); }
.btn-wa{
  background: linear-gradient(135deg, #22c55e, #16a34a); color:#fff; width:100%; margin-top:12px;
  padding:15px; font-size:1rem; box-shadow:0 4px 15px rgba(34,197,94,.3);
}
.btn-clear{
  background: linear-gradient(135deg, #ef4444, #dc2626); color:#fff; width:100%; margin-top:10px;
  padding:13px; box-shadow:0 4px 15px rgba(239,68,68,.3);
}
.btn-save{
  background: linear-gradient(135deg, #fbbf24, #f59e0b); color:#0f172a; width:100%; margin-top:10px;
  padding:12px; font-size:.85rem;
}
.small{ font-size:.72rem; color:#64748b; text-align:center; margin-top:14px; line-height:1.4; }
.status{ text-align:center; font-size:.78rem; color:#22c55e; margin-top:8px; min-height:18px; }
.dot{ width:8px; height:8px; border-radius:50%; background:#22c55e; display:inline-block; margin-right:6px; animation:pulse 2s infinite; }
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.4} }
.voice-active{ background: linear-gradient(135deg, #ef4444, #dc2626) !important; animation: pulseBtn 1s infinite; }
@keyframes pulseBtn{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.02)} }
.empty{ text-align:center; padding:30px 20px; color:#64748b; }
.empty span{ font-size:2rem; display:block; margin-bottom:8px; }
</style>
</head>
<body>
<div class="card">
<h1>Lista della Spesa</h1>
<div class="sub">Holly & Rex Group - Sincronizzata</div>
<div class="user"><img src="https://i.pravatar.cc/100?img=5"><span id="userEmail">tariffazione liguria</span><span class="dot" id="syncDot" style="margin-left:8px;"></span><small id="syncText" style="color:#22c55e">sync</small></div>

<div class="inputs">
<input id="inpNome" placeholder="Cosa ci serve? (es. Latte)" autocomplete="off" spellcheck="false">
<input id="inpQta" placeholder="Qta (es. 2L)" autocomplete="off">
</div>
<div id="suggs" class="suggestions"></div>
<div class="btns">
<button class="btn-add" id="btnAdd">+ Aggiungi</button>
<button class="btn-voice" id="btnVoice">🎤 Parla</button>
</div>

<div id="lista" class="list"></div>

<label class="note-label">📝 Note (opzionale):</label>
<textarea id="note" placeholder="Es. Prendi le buste, controlla scadenza, passa dal fornaio..."></textarea>
<label style="display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0 4px;cursor:pointer;font-size:.82rem;color:#94a3b8;font-weight:600;">
<input type="checkbox" id="toggleGiro" style="accent-color:#fbbf24;width:16px;height:16px;"> 🛒 Ordina per giro (automatico, per non tornare indietro)
</label>
<button class="btn-wa" id="btnWA">💬 Invia a WhatsApp</button>
<button class="btn-clear" id="btnClear">🗑️ Svuota Lista</button>
<div style="display:flex;gap:10px;margin-top:10px;">
<button class="btn-save" id="btnSave" style="flex:1">💾 Salva su File (Backup)</button>
<button class="btn-save" id="btnLoad" style="flex:1;background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;">📂 Carica Backup</button>
</div>
<input type="file" id="fileInput" accept=".json" style="display:none;">
<div class="status" id="status"></div>
<div class="small">
  <span id="count">0 articoli</span> • Prezzi salvati in Firebase • Tappa <b style="color:#22c55e">€</b> per aggiornare prezzo<br>
  Scrivere <i>Insalata</i> propone: Radicchio 2,49€, Lattuga 0,99€ • <i>Lascia generico</i> = resta generico
</div>
</div>

<script type="module">
// Holly & Rex - Spesa Completa 784+ righe equivalente - con prezzi Luana + Firebase doppio
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, doc, onSnapshot, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyAR8NVxtUu5QhlDWd0DXjp1lWV6vLdRM1c",
  authDomain: "holly-rex-spesa.firebaseapp.com",
  projectId: "holly-rex-spesa",
  storageBucket: "holly-rex-spesa.firebasestorage.app",
  messagingSenderId: "450072023944",
  appId: "1:450072023944:web:888af5555a5b50c599203d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
const docRef = doc(db, 'liste', 'holly-rex-condivisa');
const prezziRef = doc(db, 'liste', 'holly-rex-prezzi');

let items = [];
let prezziDB = {
  "costine": [{nome:"Costine", prezzo:6.84, nota:"Ultimo - scontrino Luana"}],
  "pane": [{nome:"Pane", prezzo:0.99, nota:"con sconto - Luana"}],
  "fagioli": [{nome:"Fagioli cannellini", prezzo:0.49, nota:"cannellini"}],
  "tonno": [{nome:"Tonno", prezzo:2.59, nota:""}],
  "insalata": [
    {nome:"Radicchio", prezzo:2.49, nota:""},
    {nome:"Lattuga", prezzo:0.99, nota:""}
  ],
  "mozzarelle": [{nome:"Mozzarelle", prezzo:1.29, nota:""}],
  "uova": [{nome:"Uova", prezzo:2.99, nota:""}],
  "prosciutto cotto": [{nome:"Prosciutto cotto", prezzo:2.49, nota:""}],
  "roast beef": [{nome:"Roast beef", prezzo:4.5, nota:""}],
  "gelati": [{nome:"Gelati", prezzo:3.49, nota:""}],
  "occhi di bue": [{nome:"Occhi di bue", prezzo:2.99, nota:""}],
  "carne bau": [{nome:"Carne bau", prezzo:5.99, nota:""}],
  "fesa": [{nome:"Fesa", prezzo:6.99, nota:""}]
};

let isLocalChange = false;
let statusTimeout = null;

function setStatus(msg, ok=true){
  const el=document.getElementById('status');
  el.textContent=msg;
  el.style.color= ok ? '#22c55e' : '#ef4444';
  clearTimeout(statusTimeout);
  statusTimeout=setTimeout(()=>{ el.textContent=''; }, 3000);
  document.getElementById('syncDot').style.background = ok ? '#22c55e' : '#ef4444';
}

function normalize(s){ return s.toLowerCase().trim(); }

async function save(){
  try{
    isLocalChange=true;
    await setDoc(docRef, {
      items,
      note: document.getElementById('note').value,
      ultimoAggiornamento: new Date().toISOString(),
      count: items.length
    }, {merge:true});
    setStatus(`✓ Salvato su Firebase (${items.length} articoli)`);
  }catch(e){
    setStatus('✗ Errore salvataggio: '+e.message, false);
    localStorage.setItem('spesa_backup_local', JSON.stringify({items, note: document.getElementById('note').value}));
  }
}

async function savePrezzi(){
  try{
    await setDoc(prezziRef, {
      map: prezziDB,
      aggiornato: new Date().toISOString()
    }, {merge:true});
    setStatus('✓ Prezzo salvato');
  }catch(e){
    setStatus('✗ Errore prezzo: '+e.message, false);
  }
}

// Auth + Sync
onAuthStateChanged(auth, async u=>{
  if(u){
    document.getElementById('userEmail').textContent=u.email;
    setStatus('Connesso come '+u.email);
    initSync();
  } else {
    try{
      await signInWithPopup(auth, provider);
    }catch(e){
      // Fallback localStorage se auth fallisce
      const local = localStorage.getItem('spesa_backup_local');
      if(local){
        try{
          const d=JSON.parse(local);
          items=d.items||[];
          document.getElementById('note').value=d.note||'';
          render();
          setStatus('Modalità offline - backup locale', false);
        }catch{}
      }
      // Auto retry login after 2s
      setTimeout(()=>signInWithPopup(auth, provider).catch(()=>{}), 2000);
    }
  }
});

function initSync(){
  onSnapshot(docRef, snap=>{
    if(snap.exists()){
      const d=snap.data();
      // Evita sovrascrittura se appena salvato localmente
      if(isLocalChange){ isLocalChange=false; return; }
      items=d.items||[];
      document.getElementById('note').value=d.note||"";
      document.getElementById('count').textContent=`${items.length} articoli`;
      render();
      if(items.length>0) setStatus(`Sincronizzato • ${items.length} articoli`);
    } else {
      // Primo avvio: crea documento vuoto
      save();
    }
  }, err=>{
    setStatus('Errore sync: '+err.message, false);
  });

  onSnapshot(prezziRef, snap=>{
    if(snap.exists()){
      const data=snap.data();
      if(data.map) prezziDB = data.map;
      render();
    } else {
      savePrezzi();
    }
  });
}

function render(){
  const cont=document.getElementById('lista');
  if(items.length===0){
    cont.innerHTML=`<div class="empty"><span>🛒</span>Lista vuota<br><small style="font-size:.8rem">Aggiungi qualcosa o ripristina backup</small></div>`;
    document.getElementById('count').textContent=`0 articoli`;
    return;
  }
  cont.innerHTML="";
  items.forEach((it, idx)=>{
    const key=normalize(it.nome);
    const storico=prezziDB[key]||[];
    const ultimo=storico.length?storico[storico.length-1]:null;
    const div=document.createElement('div');
    div.className='item';
    div.innerHTML=`
      <div class="item-left">
        <span class="item-name">${escapeHtml(it.nome)} <small style="color:#94a3b8; font-weight:400">(${escapeHtml(it.qta||'1')})</small> ${ultimo?`<span class="badge-price">${ultimo.prezzo.toFixed(2).replace('.',',')}€</span>`:''}</span>
        ${ultimo?`<span class="badge-old">Ultimo: ${ultimo.prezzo.toFixed(2).replace('.',',')}€ ${ultimo.nota?'- '+escapeHtml(ultimo.nota):''} ✓</span>`:''}
      </div>
      <div class="item-actions">
        <button class="btn-price" data-idx="${idx}" title="Aggiorna prezzo">€</button>
        <button class="btn-del" data-idx="${idx}" title="Rimuovi">×</button>
      </div>
    `;
    cont.appendChild(div);
  });
  document.getElementById('count').textContent=`${items.length} articoli`;

  cont.querySelectorAll('.btn-del').forEach(b=>b.onclick=e=>{
    const i=parseInt(e.currentTarget.dataset.idx);
    if(confirm(`Rimuovere "${items[i].nome}"?`)){
      items.splice(i,1);
      render();
      save();
    }
  });

  cont.querySelectorAll('.btn-price').forEach(b=>b.onclick=e=>{
    const idx=parseInt(e.currentTarget.dataset.idx);
    const it=items[idx];
    const attuale=prezziDB[normalize(it.nome)]?.slice(-1)[0]?.prezzo;
    const prezzoStr=prompt(`Prezzo per ${it.nome}?${attuale?` (attuale ${attuale.toFixed(2).replace('.',',')}€)`:''} - es. 2,49`, attuale? String(attuale).replace('.',',') : "");
    if(prezzoStr===null) return;
    const prezzo=parseFloat(prezzoStr.replace(',','.'));
    if(isNaN(prezzo) || prezzo<=0) return alert("Prezzo non valido");
    const nota=prompt("Nota (opzionale) es. 'con sconto', 'cannellini' - lascia vuoto se niente", "")||"";
    const key=normalize(it.nome);
    if(!prezziDB[key]) prezziDB[key]=[];
    prezziDB[key].push({nome:it.nome, prezzo, nota});
    // Mantieni solo ultimi 5 prezzi per tipo
    if(prezziDB[key].length>5) prezziDB[key]=prezziDB[key].slice(-5);
    render();
    savePrezzi();
  });
}

function escapeHtml(s){
  const d=document.createElement('div');
  d.textContent=s;
  return d.innerHTML;
}

// Autocomplete prezzi
document.getElementById('inpNome').addEventListener('input', e=>{
  const val=normalize(e.target.value);
  const sugCont=document.getElementById('suggs');
  sugCont.innerHTML="";
  if(val.length<2) return;
  let found=0;
  for(const k in prezziDB){
    if(k.includes(val) || val.includes(k)){
      prezziDB[k].slice(-2).forEach(p=>{
        if(found>=6) return;
        const chip=document.createElement('span');
        chip.className='chip';
        chip.textContent=`${p.nome} ${p.prezzo.toFixed(2).replace('.',',')}€`;
        chip.title=p.nota||'';
        chip.onclick=()=>{
          document.getElementById('inpNome').value=p.nome;
          sugCont.innerHTML="";
          document.getElementById('inpQta').focus();
        };
        sugCont.appendChild(chip);
        found++;
      });
    }
  }
  if(found>0){
    const gen=document.createElement('span');
    gen.className='chip chip-generic';
    gen.textContent='Lascia generico';
    gen.onclick=()=>{ sugCont.innerHTML=""; document.getElementById('inpQta').focus(); };
    sugCont.appendChild(gen);
  }
});

// Aggiungi
document.getElementById('btnAdd').onclick=()=>{
  const nome=document.getElementById('inpNome').value.trim();
  const qta=document.getElementById('inpQta').value.trim()||"1";
  if(!nome){ document.getElementById('inpNome').focus(); return; }
  items.push({nome, qta});
  document.getElementById('inpNome').value="";
  document.getElementById('inpQta').value="";
  document.getElementById('suggs').innerHTML="";
  render();
  save();
  document.getElementById('inpNome').focus();
};

document.getElementById('inpNome').addEventListener('keydown', e=>{
  if(e.key==='Enter'){ e.preventDefault(); document.getElementById('btnAdd').click(); }
});
document.getElementById('inpQta').addEventListener('keydown', e=>{
  if(e.key==='Enter'){ e.preventDefault(); document.getElementById('btnAdd').click(); }
});

// Svuota
document.getElementById('btnClear').onclick=()=>{
  if(items.length===0) return;
  if(confirm(`Svuotare tutta la lista? (${items.length} articoli)\nVerrà salvato un backup automatico.`)){
    localStorage.setItem('backup_pre_svuota_'+Date.now(), JSON.stringify({items, note: document.getElementById('note').value, date:new Date().toISOString()}));
    items=[];
    render();
    save();
    setStatus('Lista svuotata - backup locale salvato');
  }
};

// Note
document.getElementById('note').addEventListener('change', save);
document.getElementById('note').addEventListener('blur', save);

// WhatsApp
document.getElementById('btnWA').onclick=()=>{
  if(items.length===0) return alert('Lista vuota!');
  let txt="*Lista Spesa Holly & Rex* 🛒\\n";
  txt+=`_${new Date().toLocaleDateString('it-IT')}_\\n\\n`;
  let totale=0;
  items.forEach(it=>{
    const key=normalize(it.nome);
    const storico=prezziDB[key];
    const ultimo=storico&&storico.length?storico[storico.length-1]:null;
    const prezzoTxt=ultimo?` [${ultimo.prezzo.toFixed(2)}€]`:'';
    if(ultimo) totale+=ultimo.prezzo * (parseFloat(it.qta)||1);
    txt+=`• ${it.nome} (${it.qta})${prezzoTxt}\\n`;
  });
  if(totale>0) txt+=`\\n*Totale stimato: ${totale.toFixed(2)}€*\\n`;
  const n=document.getElementById('note').value;
  if(n) txt+=`\\n_Note: ${n}_`;
  window.open("https://wa.me/?text="+encodeURIComponent(txt), "_blank");
};

// Backup su file
document.getElementById('btnSave').onclick=()=>{
  const data={
    items,
    note: document.getElementById('note').value,
    prezziDB,
    date: new Date().toISOString(),
    version: "Holly&Rex 784+ con prezzi"
  };
  const blob=new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`Lista_Spesa_HollyRex_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  setStatus('✓ Backup scaricato');
};

// Voce
let recognition=null;
let listening=false;
document.getElementById('btnVoice').onclick=()=>{
  const btn=document.getElementById('btnVoice');
  if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)){
    alert('Il tuo browser non supporta il riconoscimento vocale. Usa Chrome su Android/PC.');
    return;
  }
  if(listening){
    recognition.stop();
    return;
  }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition=new SpeechRecognition();
  recognition.lang='it-IT';
  recognition.interimResults=false;
  recognition.maxAlternatives=1;
  btn.textContent='🔴 Ascolto...';
  btn.classList.add('voice-active');
  listening=true;
  setStatus('🎤 Parla... es. "Latte 2 litri"');
  recognition.start();
  recognition.onresult=(e)=>{
    const transcript=e.results[0][0].transcript;
    setStatus(`Hai detto: "${transcript}"`);
    // Parsing semplice: ultimo token come quantità se contiene numeri
    const parts=transcript.trim().split(' ');
    let qta='1';
    let nome=transcript;
    const last=parts[parts.length-1];
    if(/\d/.test(last)){
      qta=last;
      nome=parts.slice(0,-1).join(' ');
    }
    document.getElementById('inpNome').value=nome.charAt(0).toUpperCase()+nome.slice(1);
    document.getElementById('inpQta').value=qta;
    // Trigger suggestions
    document.getElementById('inpNome').dispatchEvent(new Event('input'));
  };
  recognition.onerror=(e)=>{
    setStatus('Errore voce: '+e.error, false);
    btn.textContent='🎤 Parla';
    btn.classList.remove('voice-active');
    listening=false;
  };
  recognition.onend=()=>{
    btn.textContent='🎤 Parla';
    btn.classList.remove('voice-active');
    listening=false;
  };
};


// --- CARICA BACKUP (mancava!) ---
document.getElementById('btnLoad').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange=(e)=>{
  const f=e.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=async ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!confirm(`Caricare backup del ${new Date(data.date||Date.now()).toLocaleString('it-IT')} con ${ (data.items||[]).length } articoli?\nSovrascriverà la lista attuale.`)) return;
      items=data.items||[];
      document.getElementById('note').value=data.note||"";
      if(data.prezziDB) {
        // merge prezzi
        for(const k in data.prezziDB){
          if(!prezziDB[k]) prezziDB[k]=data.prezziDB[k];
          else {
            // aggiungi solo se prezzo nuovo
            data.prezziDB[k].forEach(p=>{
              if(!prezziDB[k].some(x=>x.prezzo===p.prezzo)) prezziDB[k].push(p);
            });
          }
        }
        await savePrezzi();
      }
      render();
      await save();
      setStatus(`✓ Backup caricato: ${items.length} articoli`);
    }catch(err){ alert('File non valido: '+err.message); setStatus('Errore caricamento backup', false); }
    e.target.value="";
  };
  r.readAsText(f);
};

// --- REPARTI AUTOMATICI - invisibili, zero domande ---
const repartoMap = {
  "insalata":1, "radicchio":1, "lattuga":1, "pomodori":1, "frutta":1, "banane":1, "mele":1, "uova":1, "verdura":1, "limoni":1, "zucchine":1,
  "pane":2, "panini":2, "focaccia":2,
  "costine":3, "carne":3, "fesa":3, "roast beef":3, "pollo":3, "prosciutto":3, "macinato":3, "salsiccia":3, "carne bau":3,
  "mozzarelle":4, "latte":4, "yogurt":4, "burro":4, "formaggio":4, "tonno":4,
  "pasta":5, "riso":5, "fagioli":5, "olio":5, "sugo":5,
  "gelati":6, "ghiaccioli":6, "surge":6,
  "occhi di bue":7, "biscotti":7, "merendine":7, "cioccolato":7
};
function getReparto(nome){
  const n=normalize(nome);
  for(const k in repartoMap){ if(n.includes(k)||k.includes(n)) return repartoMap[k]; }
  return 99;
}
const repartoNames = {1:"🥦 Frutta/Verdura",2:"🥖 Pane/Forno",3:"🥩 Carni",4:"🥛 Frigo/Latticini",5:"🍝 Dispensa",6:"🧊 Surgelati",7:"🍪 Dolci",99:"🛒 Altro"};

function renderWithGiro(){
  if(!document.getElementById('toggleGiro')?.checked){ render(); return; }
  // ordinata per reparto
  const cont=document.getElementById('lista');
  if(items.length===0){ render(); return; }
  const sorted=[...items].map((it,i)=>({it, orig:i, rep:getReparto(it.nome)})).sort((a,b)=>a.rep-b.rep);
  cont.innerHTML="";
  let lastRep=null;
  sorted.forEach(obj=>{
    if(obj.rep!==lastRep){
      lastRep=obj.rep;
      const h=document.createElement('div');
      h.style.cssText="font-size:.75rem;color:#fbbf24;font-weight:800;margin:10px 0 4px 4px;letter-spacing:.04em;";
      h.textContent=repartoNames[lastRep]||"Altro";
      cont.appendChild(h);
    }
    const it=obj.it; const idx=obj.orig;
    const key=normalize(it.nome);
    const storico=prezziDB[key]||[];
    const ultimo=storico.length?storico[storico.length-1]:null;
    const div=document.createElement('div');
    div.className='item';
    div.innerHTML=`<div class="item-left"><span class="item-name">${escapeHtml(it.nome)} <small style="color:#94a3b8">(${escapeHtml(it.qta||'1')})</small> ${ultimo?`<span class="badge-price">${ultimo.prezzo.toFixed(2).replace('.',',')}€</span>`:''}</span>${ultimo?`<span class="badge-old">Ultimo: ${ultimo.prezzo.toFixed(2).replace('.',',')}€ ${ultimo.nota?'- '+escapeHtml(ultimo.nota):''} ✓</span>`:''}</div><div class="item-actions"><button class="btn-price" data-idx="${idx}">€</button><button class="btn-del" data-idx="${idx}">×</button></div>`;
    cont.appendChild(div);
  });
  document.getElementById('count').textContent=`${items.length} articoli • ordinati per giro`;
  // riattacca eventi
  cont.querySelectorAll('.btn-del').forEach(b=>b.onclick=e=>{ const i=parseInt(e.currentTarget.dataset.idx); if(confirm(`Rimuovere "${items[i].nome}"?`)){ items.splice(i,1); renderWithGiro(); save(); } });
  cont.querySelectorAll('.btn-price').forEach(b=>b.onclick=e=>{
    const idx=parseInt(e.currentTarget.dataset.idx);
    const it=items[idx];
    const attuale=prezziDB[normalize(it.nome)]?.slice(-1)[0]?.prezzo;
    const prezzoStr=prompt(`Prezzo per ${it.nome}?`, attuale?String(attuale).replace('.',','):"");
    if(prezzoStr===null) return; const prezzo=parseFloat(prezzoStr.replace(',','.')); if(isNaN(prezzo)||prezzo<=0) return;
    const nota=prompt("Nota opzionale","")||""; const key=normalize(it.nome); if(!prezziDB[key]) prezziDB[key]=[]; prezziDB[key].push({nome:it.nome, prezzo, nota}); if(prezziDB[key].length>5) prezziDB[key]=prezziDB[key].slice(-5); renderWithGiro(); savePrezzi();
  });
}
document.getElementById('toggleGiro').onchange=()=>{ localStorage.setItem('giro_enabled', document.getElementById('toggleGiro').checked); renderWithGiro(); };
// ripristina stato toggle
const giroSaved=localStorage.getItem('giro_enabled')==='true';
document.getElementById('toggleGiro').checked=giroSaved;
// sovrascrivi render originale per chiamare quello con giro quando attivo
const origRender=render;
render=function(){ if(document.getElementById('toggleGiro')?.checked) renderWithGiro(); else origRender(); };

// Service worker

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

// Previeni chiusura accidentale se ci sono articoli
window.addEventListener('beforeunload', e=>{
  if(items.length>0){
    e.preventDefault();
    e.returnValue='';
  }
});
</script>
