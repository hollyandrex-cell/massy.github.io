d #334155}.status{text-align:center;font-size:.78rem;color:#22c55e;margin-top:8px;min-height:18px}.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block;margin-right:6px}.cat-header{font-size:.78rem;color:#fbbf24;font-weight:800;margin:12px 0 4px 4px;letter-spacing:.04em;text-transform:uppercase}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}.modal{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:20px;width:100%;max-width:380px}.modal h3{color:#fbbf24;margin-bottom:10px}.modal input{width:100%;margin-bottom:10px}.modal-btns{display:flex;gap:10px;margin-top:12px}

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, doc, onSnapshot, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const firebaseConfig={apiKey:"AIzaSyAR8NVxtUu5QhlDWd0DXjp1lWV6vLdRM1c",authDomain:"holly-rex-spesa.firebaseapp.com",projectId:"holly-rex-spesa",storageBucket:"holly-rex-spesa.firebasestorage.app",messagingSenderId:"450072023944",appId:"1:450072023944:web:888af5555a5b50c599203d"};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);const provider=new GoogleAuthProvider();const docRef=doc(db,'liste','holly-rex-condivisa');const prezziRef=doc(db,'liste','holly-rex-prezzi');
let items=[];let prezziDB={};let isLocalChange=false;
function setStatus(m,ok=true){const e=document.getElementById('status');e.textContent=m;e.style.color=ok?'#22c55e':'#ef4444';setTimeout(()=>{if(e.textContent===m)e.textContent='';},4000);}
function normalize(s){return s.toLowerCase().trim().replace(/\s+/g,' ').replace(/[^a-z0-9àèéìòù ]/g,'').trim();}
function parseQta(q){const m=String(q||'1').replace(',','.').match(/(\d+(\.\d+)?)/);return m?parseFloat(m[1]):1;}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
async function save(){try{isLocalChange=true;await setDoc(docRef,{items,note:document.getElementById('note').value,ultimoAggiornamento:new Date().toISOString(),count:items.length},{merge:true});setStatus(`✓ Salvato ${items.length} art.`);}catch(e){setStatus('Errore save '+e.message,false);}}
async function savePrezzi(){try{await setDoc(prezziRef,{map:prezziDB,aggiornato:new Date().toISOString(),version:'v3-collegata-bilancio'},{merge:true});setStatus('✓ Prezzi salvati');}catch(e){setStatus('Errore prezzi '+e.message,false);}}
const isInIframe=window.self!==window.top;
function accediConGoogle(){if(isInIframe)return;signInWithPopup(auth,provider).catch(e=>setStatus('Login richiesto',false));}
if(isInIframe){document.getElementById('userEmail').textContent='Anteprima';document.getElementById('syncText').textContent='pausa';}
else{onAuthStateChanged(auth,async u=>{if(u){document.getElementById('userEmail').textContent=u.email;if(u.photoURL)document.getElementById('userAvatar').src=u.photoURL;initSync();}else{document.getElementById('userEmail').textContent='Clicca Accedi';document.getElementById('syncText').textContent='non connesso';const userDiv=document.querySelector('.user');if(userDiv&&!document.getElementById('btnAccedi')){const btn=document.createElement('button');btn.id='btnAccedi';btn.textContent='🔑 Accedi';btn.style.cssText='margin-left:10px;background:#fbbf24;color:#0f172a;border:none;padding:6px 10px;border-radius:8px;font-weight:800;cursor:pointer;';btn.onclick=accediConGoogle;userDiv.appendChild(btn);}}});}
function initSync(){if(isInIframe)return;onSnapshot(docRef,snap=>{if(snap.exists()){const d=snap.data();if(isLocalChange){isLocalChange=false;return;}items=d.items||[];document.getElementById('note').value=d.note||"";render();}else save();});onSnapshot(prezziRef,snap=>{if(snap.exists()){const data=snap.data();if(data.map){prezziDB=data.map;render();}}else savePrezzi();});}
function getPrezzo(cat,sub){const c=prezziDB[normalize(cat)];if(!c)return null;const s=c[normalize(sub)]||c[normalize(cat)]||c['_generico'];if(!s||!s.length)return null;return s[s.length-1];}
function render(){
  const cont=document.getElementById('lista');
  if(items.length===0){cont.innerHTML=`<div style="text-align:center;padding:30px;color:#64748b;">🛒 Lista vuota</div>`;document.getElementById('count').textContent='0 articoli';calcTotale();return;}
  const gruppi={};items.forEach((it,idx)=>{const cat=it.categoria||it.nome.split(' - ')[0]||it.nome;if(!gruppi[cat])gruppi[cat]=[];gruppi[cat].push({...it,origIdx:idx});});
  cont.innerHTML="";
  for(const catName in gruppi){
    const header=document.createElement('div');header.className='cat-header';header.textContent=catName.toUpperCase();cont.appendChild(header);
    gruppi[catName].forEach(obj=>{
      const it=obj;const idx=obj.origIdx;const qNum=parseQta(it.qta||'1');
      const sub=(it.sottocategoria&&it.sottocategoria!=='_generico')?it.sottocategoria:'';let ultimo=null;if(sub)ultimo=getPrezzo(catName,sub);if(!ultimo)ultimo=getPrezzo(it.nome,it.nome);if(!ultimo&&it.categoria&&it.sottocategoria)ultimo=getPrezzo(it.categoria,it.sottocategoria);
      const totRiga=ultimo&&typeof ultimo.prezzo==='number'?(ultimo.prezzo*qNum).toFixed(2).replace('.',','):null;
      const isGeneric=!it.sottocategoria||it.sottocategoria==='_generico';
      const displayName=it.sottocategoria&&it.sottocategoria!=='_generico'?`${escapeHtml(it.categoria)} - <b style="color:#22c55e">${escapeHtml(it.sottocategoria)}</b>`:escapeHtml(it.categoria||it.nome);
      const prezzoBadge=ultimo&&typeof ultimo.prezzo==='number'?`<span class="badge-price">${ultimo.prezzo.toFixed(2).replace('.',',')}€ cad.</span>`:'';
      const vecchioBadge=ultimo&&typeof ultimo.prezzo==='number'?`<span class="badge-old">${totRiga?`Tot: ${totRiga}€ • `:''}Ultimo: ${ultimo.prezzo.toFixed(2).replace('.',',')}€</span>`:'';
      const div=document.createElement('div');div.className='item';
      div.innerHTML=`<div class="item-left"><span class="item-name">${displayName} ${prezzoBadge}</span>${vecchioBadge}${isGeneric?`<small style="color:#fbbf24;font-size:.75rem;">⚠ Generico ${it.qta} pz - clicca €</small>`:''}</div><div class="item-actions" style="flex-direction:column;gap:4px;"><div style="display:flex;gap:4px;align-items:center;"><button class="btn-qty" data-act="minus" data-idx="${idx}" style="background:#1e293b;border:1px solid #334155;color:#fff;width:30px;height:30px;border-radius:8px;cursor:pointer;font-weight:800;">−</button><span style="min-width:28px;text-align:center;font-weight:800;font-size:.95rem;">${escapeHtml(it.qta||'1')}</span><button class="btn-qty" data-act="plus" data-idx="${idx}" style="background:#1e293b;border:1px solid #334155;color:#fff;width:30px;height:30px;border-radius:8px;cursor:pointer;font-weight:800;">+</button></div><div style="display:flex;gap:4px;"><button class="btn-edit" data-idx="${idx}">✏</button><button class="btn-price" data-idx="${idx}">€</button><button class="btn-del" data-idx="${idx}">×</button></div></div>`;
      cont.appendChild(div);
    });
  }
  document.getElementById('count').textContent=`${items.length} articoli`;calcTotale();
  cont.querySelectorAll('.btn-del').forEach(b=>b.onclick=e=>{const i=parseInt(e.currentTarget.dataset.idx);if(confirm(`Rimuovere "${items[i].categoria||items[i].nome}"?`)){items.splice(i,1);render();save();}});
  cont.querySelectorAll('.btn-price').forEach(b=>b.onclick=e=>openPriceModal(parseInt(e.currentTarget.dataset.idx)));
  cont.querySelectorAll('.btn-edit').forEach(b=>b.onclick=e=>editItem(parseInt(e.currentTarget.dataset.idx)));
  cont.querySelectorAll('.btn-qty').forEach(b=>b.onclick=e=>{const i=parseInt(e.currentTarget.dataset.idx);const act=e.currentTarget.dataset.act;let q=parseQta(items[i].qta||'1');if(act==='plus')q++;else q--;if(q<=0){if(confirm(`Rimuovere?`)){items.splice(i,1);}else return;}else{items[i].qta=String(q);}render();save();});
}
function calcTotale(){let tot=0,prezzati=0;items.forEach(it=>{const cat=it.categoria||it.nome.split(' - ')[0]||it.nome;const sub=it.sottocategoria||it.nome;const storico=prezziDB[normalize(cat)]?.[normalize(sub)]||prezziDB[normalize(it.nome)]?.[normalize(it.nome)];const ultimo=storico?storico[storico.length-1]:null;if(ultimo&&typeof ultimo.prezzo==='number'){tot+=ultimo.prezzo*parseQta(it.qta||'1');prezzati++;}});const box=document.getElementById('totaleBox');if(items.length>0){box.style.display='flex';document.getElementById('totaleVal').textContent=tot.toFixed(2).replace('.',',')+'€';document.getElementById('totaleDett').textContent=`${prezzati} su ${items.length} prezzati`;}else box.style.display='none';return tot;}
function editItem(idx){const it=items[idx];const catCorrente=it.categoria||it.nome;const subCorrente=it.sottocategoria&&it.sottocategoria!=='_generico'?it.sottocategoria:'';const nuovo=prompt(`Modifica`,subCorrente||catCorrente);if(nuovo===null)return;let raw=nuovo.trim();if(!raw)return;let newCat=catCorrente;let newSub='';if(raw.includes('-')){const p=raw.split('-').map(s=>s.trim()).filter(Boolean);if(p.length>=2){newCat=p[0];newSub=p.slice(1).join(' - ');}else{newCat=catCorrente;newSub=p[0];}}else if(raw.toLowerCase().startsWith(catCorrente.toLowerCase()+' ')){newCat=catCorrente;newSub=raw.slice(catCorrente.length).trim();}else if(raw.toLowerCase()!==catCorrente.toLowerCase()){newCat=catCorrente;newSub=raw;}it.categoria=newCat;it.sottocategoria=newSub||'';it.nome=newSub?`${newCat} - ${newSub}`:newCat;render();save();}
document.getElementById('inpNome').addEventListener('input',e=>{
  const raw=e.target.value;const val=normalize(raw);const sugCont=document.getElementById('suggs');sugCont.innerHTML="";if(val.length<2)return;
  for(const catKey in prezziDB){if(catKey.includes(val)||val.includes(catKey)){const catObj=prezziDB[catKey];for(const subKey in catObj){const storico=catObj[subKey];const ultimo=storico[storico.length-1];if(!ultimo||typeof ultimo.prezzo!=='number')continue;const chip=document.createElement('span');chip.className='chip chip-sub';const isGen=subKey==='_generico';const prettySub=isGen?'Generico':subKey;const labelSub=(subKey===catKey||isGen)?catKey:`${catKey} - ${prettySub}`;chip.textContent=`${labelSub} ${ultimo.prezzo.toFixed(2).replace('.',',')}€`;chip.onclick=()=>{document.getElementById('inpNome').value=catKey;sugCont.dataset.chosenCat=catKey;sugCont.dataset.chosenSub=subKey;sugCont.innerHTML="";const chosen=document.createElement('span');chosen.className='chip chip-cat';chosen.textContent=`✓ ${labelSub}`;sugCont.appendChild(chosen);document.getElementById('inpQta').focus();};sugCont.appendChild(chip);}}}
  const gen=document.createElement('span');gen.className='chip chip-generic';gen.textContent=raw?`${raw} - Generico`:'Generico';gen.onclick=()=>{sugCont.innerHTML="";sugCont.dataset.chosenCat="";sugCont.dataset.chosenSub="";document.getElementById('inpQta').focus();};sugCont.appendChild(gen);
});
document.getElementById('btnAdd').onclick=()=>{
  const rawNome=document.getElementById('inpNome').value.trim();if(!rawNome){document.getElementById('inpNome').focus();return;}
  const qta=document.getElementById('inpQta').value.trim()||"1";const sugCont=document.getElementById('suggs');const chosenCat=sugCont.dataset.chosenCat;const chosenSub=sugCont.dataset.chosenSub;
  let categoria,sottocategoria,nomeFinale;if(chosenCat){categoria=chosenCat;sottocategoria=chosenSub===chosenCat?'':chosenSub;nomeFinale=sottocategoria?`${categoria} - ${sottocategoria}`:categoria;}else{categoria=rawNome;sottocategoria='';nomeFinale=categoria;}
  const isGeneric=!sottocategoria||sottocategoria==='_generico';const existingIdx=isGeneric?-1:items.findIndex(it=>normalize(it.categoria||it.nome)===normalize(categoria)&&normalize(it.sottocategoria||'')===normalize(sottocategoria));
  if(existingIdx!==-1){const qOld=parseQta(items[existingIdx].qta);items[existingIdx].qta=String(qOld+parseQta(qta));}else{items.push({nome:nomeFinale,categoria,sottocategoria:sottocategoria||'',qta});}
  document.getElementById('inpNome').value="";document.getElementById('inpQta').value="";document.getElementById('suggs').innerHTML="";document.getElementById('suggs').dataset.chosenCat="";document.getElementById('suggs').dataset.chosenSub="";render();save();document.getElementById('inpNome').focus();
};
function openPriceModal(idx){
  const it=items[idx];const modal=document.getElementById('priceModal');const qTot=parseQta(it.qta||'1');const cat=it.categoria||it.nome;const isGen=!it.sottocategoria||it.sottocategoria==='_generico';
  document.getElementById('modalTitle').textContent=isGen?`Prezzo per ${cat} (${qTot} gen.)`:`Prezzo per ${it.nome}`;
  document.getElementById('modalDesc').textContent=isGen?`Hai ${qTot} ${cat} generici. Specifica tipo e qta.`:`Modifica prezzo`;
  document.getElementById('modalSub').value=isGen?'':(it.sottocategoria||'');document.getElementById('modalQta').value=isGen?'1':String(qTot);document.getElementById('modalPrice').value='';document.getElementById('modalHint').textContent=isGen?`Se metti 1 su ${qTot}, resta ${qTot-1} gen.`:'Totale per qta';
  modal.style.display='flex';document.getElementById('modalSub').focus();window._modalIdx=idx;
}
document.getElementById('modalCancel').onclick=()=>document.getElementById('priceModal').style.display='none';
document.getElementById('modalOk').onclick=async()=>{
  const idx=window._modalIdx;const it=items[idx];const subRaw=document.getElementById('modalSub').value.trim();const qtaSubRaw=document.getElementById('modalQta').value.trim().replace(',','.');const priceRaw=document.getElementById('modalPrice').value.trim().replace(',','.');let qtaSub=parseFloat(qtaSubRaw)||1;const prezzoTot=parseFloat(priceRaw);
  if(!subRaw){alert('Tipo?');return;}if(isNaN(prezzoTot)||prezzoTot<=0){alert('Prezzo?');return;}
  const qTot=parseQta(it.qta||'1');const categoria=it.categoria||it.nome.split(' - ')[0]||it.nome;const sottocategoria=subRaw;const normCat=normalize(categoria);const normSub=normalize(sottocategoria);const prezzoUnit=prezzoTot/qtaSub;
  if(!prezziDB[normCat])prezziDB[normCat]={};if(!prezziDB[normCat][normSub])prezziDB[normCat][normSub]=[];prezziDB[normCat][normSub].push({nome:sottocategoria,prezzo:prezzoUnit,data:new Date().toISOString()});if(prezziDB[normCat][normSub].length>5)prezziDB[normCat][normSub]=prezziDB[normCat][normSub].slice(-5);
  const isGen=!it.sottocategoria||it.sottocategoria==='_generico';
  if(isGen){if(qtaSub>=qTot){it.categoria=categoria;it.sottocategoria=sottocategoria;it.nome=`${categoria} - ${sottocategoria}`;it.qta=String(qtaSub);}else{const rimanenti=qTot-qtaSub;it.qta=String(rimanenti);items.splice(idx+1,0,{nome:`${categoria} - ${sottocategoria}`,categoria,sottocategoria,qta:String(qtaSub)});setTimeout(()=>{if(confirm(`Restano ${rimanenti} ${categoria} gen. Vuoi specificare l'altro?`))openPriceModal(idx);},400);}}else{it.sottocategoria=sottocategoria;it.nome=`${categoria} - ${sottocategoria}`;it.qta=String(qtaSub);}
  document.getElementById('priceModal').style.display='none';render();await savePrezzi();await save();
};

// --- NUOVO: COLLEGAMENTO A BILANCIO ---
function mappaCategoriaSpesaABilancio(cat){
  const c=normalize(cat);
  if(c.includes('bau')||c.includes('animal')||c.includes('cane')||c.includes('crocchette')) return 'Animali';
  if(c.includes('frutta')||c.includes('verdura')||c.includes('insalata')||c.includes('pasta')||c.includes('carne')||c.includes('pesce')||c.includes('latte')||c.includes('pane')) return 'Spesa / Cibo';
  if(c.includes('pulizie')||c.includes('detersivo')) return 'Casa / Affitto';
  return 'Spesa / Cibo'; // default
}

document.getElementById('btnBilancio').onclick=()=>{
  if(items.length===0){alert('Lista vuota!');return;}
  const totale=calcTotale();
  const prezzati=items.filter(it=>{const cat=it.categoria||it.nome;const sub=it.sottocategoria||it.nome;const storico=prezziDB[normalize(cat)]?.[normalize(sub)]||prezziDB[normalize(it.nome)]?.[normalize(it.nome)];return storico&&storico[storico.length-1]&&typeof storico[storico.length-1].prezzo==='number';}).length;
  if(prezzati===0){alert('Devi prima mettere i prezzi con €!');return;}
  if(!confirm(`Vuoi registrare la spesa di ${totale.toFixed(2)}€ nel bilancio?\n${items.length} articoli, ${prezzati} prezzati.\nVerrà creato un movimento in "Spesa / Cibo".`)) return;

  // Costruiamo descrizione dettagliata
  let descrizioneDett='Spesa: ';
  const perCat={};
  items.forEach(it=>{
    const cat=it.categoria||it.nome;
    const sub=it.sottocategoria?` ${it.sottocategoria}`:'';
    const q=it.qta||'1';
    const storico=prezziDB[normalize(cat)]?.[normalize(it.sottocategoria||it.nome)]||prezziDB[normalize(it.nome)]?.[normalize(it.nome)];
    const ultimo=storico?storico[storico.length-1]:null;
    const prezzoTot=ultimo? (ultimo.prezzo*parseQta(q)).toFixed(2) : '?';
    descrizioneDett+=`${cat}${sub} x${q} (${prezzoTot}€), `;
    const catBil=mappaCategoriaSpesaABilancio(cat);
    if(!perCat[catBil]) perCat[catBil]=0;
    if(ultimo) perCat[catBil]+=ultimo.prezzo*parseQta(q);
  });
  descrizioneDett=descrizioneDett.slice(0,-2); // togli ultima virgola
  if(descrizioneDett.length>180) descrizioneDett=descrizioneDett.substring(0,177)+'...';

  // Salva in localStorage bilancio - compatibile con tuo codice v3
  const STORAGE_KEY='hollyRexBilancio_v3';
  let movimenti=[];
  try{const dati=localStorage.getItem(STORAGE_KEY);if(dati)movimenti=JSON.parse(dati);}catch(e){movimenti=[];}

  // Se ci sono categorie diverse (es. Animali + Cibo), crea movimenti separati, altrimenti uno unico
  const cats=Object.keys(perCat);
  if(cats.length===1){
    movimenti.unshift({id:Date.now(),data:new Date().toISOString(),tipo:'uscita',categoria:cats[0],importo:totale,descrizione:descrizioneDett});
  } else {
    cats.forEach(catBil=>{
      movimenti.unshift({id:Date.now()+Math.random(),data:new Date().toISOString(),tipo:'uscita',categoria:catBil,importo:perCat[catBil],descrizione:`${catBil}: ${descrizioneDett.substring(0,100)}`});
    });
  }

  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(movimenti));
    setStatus(`✅ Registrato in Bilancio: ${totale.toFixed(2)}€ - ${cats.join(', ')}`,true);
    alert(`✅ Fatto amore! Ho registrato ${totale.toFixed(2)}€ nel bilancio.\n\nCategoria: ${cats.join(', ')}\n\nOra vai nell'app Bilancio e vedrai la spesa nello storico!`);
  }catch(e){
    alert('❌ Errore: apri prima l app Bilancio su GitHub Pages una volta, così creo lo storage.');
  }
};

document.getElementById('btnClear').onclick=()=>{if(items.length===0)return;if(confirm(`Svuotare ${items.length} art.?`)){localStorage.setItem('backup_pre_svuota_'+Date.now(),JSON.stringify({items}));items=[];render();save();}};
document.getElementById('note').addEventListener('change',save);
document.getElementById('btnWA').onclick=()=>{if(items.length===0)return alert('Lista vuota!');let txt="*Lista Spesa Holly & Rex* 🛒\n";items.forEach(it=>{txt+=`• ${it.categoria||it.nome}${it.sottocategoria?' - '+it.sottocategoria:''} (${it.qta})\n`;});window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank");};
document.getElementById('btnSave').onclick=()=>{const data={items,note:document.getElementById('note').value,prezziDB,date:new Date().toISOString(),version:"v3-bilancio"};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`Lista_Spesa_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);};
document.getElementById('btnLoad').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange=(e)=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async ev=>{try{const data=JSON.parse(ev.target.result);if(!confirm(`Caricare ${data.items?.length||0} art.?`))return;items=data.items||[];document.getElementById('note').value=data.note||"";if(data.prezziDB){for(const cat in data.prezziDB){if(!prezziDB[cat])prezziDB[cat]=data.prezziDB[cat];else{for(const sub in data.prezziDB[cat]){if(!prezziDB[cat][sub])prezziDB[cat][sub]=data.prezziDB[cat][sub];}}}await savePrezzi();}render();await save();}catch(err){alert('File non valido '+err.message);}};r.readAsText(f);};
</script>
