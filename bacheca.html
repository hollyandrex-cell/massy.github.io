<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
    <!-- FAVICON REX & BIMBA -->
<link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicons/favicon-16x16.png">
<link rel="manifest" href="favicons/site.webmanifest">
<link rel="shortcut icon" href="favicons/favicon.ico">

  <title>📖 La Bacheca • Massy</title>
  
  <!-- META DESCRIPTION PER GOOGLE -->
  <meta name="description" content="Holly and Rex Group: un viaggio musicale con Rex, Bimba, Dj Ling, Dj Luna, Dj Nova. Lascia un messaggio nella bacheca.">
  
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/stile.css">
  <link rel="stylesheet" href="css/bacheca.mobile.css" media="(max-width: 768px)">
  <style>
    
    body {
      min-height: 100vh;
      background: url('immagini/bacheca-rex-bimba.jpg') no-repeat center center fixed;
      background-size: cover;
      background-color: rgba(10, 12, 20, 0.3);
      background-blend-mode: multiply;
      color: #f8d59e;
      overflow-x: hidden;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 40px;
    }

    /* HEADER TRASPARENTE */
    .bacheca-header {
      background: transparent;
      padding-top: 40px;
      width: 100%;
      text-align: center;
      margin-bottom: 30px;
    }

    .bacheca-header h1 {
      font-family: 'Playfair Display', serif;
      color: #f8d59e;
      font-size: 3rem;
      text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.9);
      margin: 0;
    }

    .bacheca-header p {
      font-style: italic;
      opacity: 0.9;
      margin-top: 10px;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
    }

    /* CONTENUTO PRINCIPALE */
    .bacheca-content {
      background-color: transparent;
      padding: 30px;
      border-radius: 10px;
      margin: 30px auto;
      max-width: 900px;
      text-align: center;
      width: 100%;
    }

    /* BACHECA SCORREVOLE */
    .bacheca-container {
      margin-top: 50px;
      max-width: 700px;
      width: 100%;
      height: 400px; 
      overflow: hidden;
      position: relative;
      background: transparent;
      border: none;
      box-shadow: none;
      margin-left: auto;
      margin-right: auto;
    }

    .bacheca-items {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
    }

    .bacheca-item {
      display: flex;
      align-items: center;
      padding: 20px;
      gap: 20px;
      min-height: 120px;
      box-sizing: border-box;
      background: rgba(10, 12, 20, 0.4); 
      border-radius: 12px;
      margin-bottom: 15px;
      border: 1px solid rgba(248, 213, 158, 0.3);
    }

    .bacheca-item img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #f8d59e;
      flex-shrink: 0;
    }

    .bacheca-item-content {
      flex-grow: 1;
      text-align: left;
    }

    .bacheca-item p {
      color: #f8d59e;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1em;
      margin: 0 0 8px 0;
      text-align: left;
      font-style: italic;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
      line-height: 1.5;
    }

    .bacheca-item-autore {
      color: #d35400;
      font-family: 'Playfair Display', serif;
      font-weight: bold;
      font-size: 1em;
      text-align: left;
      display: block;
    }

    .bacheca-item-data {
      color: #f8d59e;
      font-size: 0.85em;
      opacity: 0.7;
      text-align: left;
      display: block;
      margin-top: 5px;
    }

    /* PULSANTE SCRIVI */
    .scrivi-container {
      margin: 40px auto;
      padding: 25px 30px;
      background: rgba(10, 12, 20, 0.5);
      border-radius: 20px;
      border: 1px solid rgba(248, 213, 158, 0.3);
      max-width: 650px;
    }

    .scrivi-container h3 {
      font-family: 'Playfair Display', serif;
      color: #fd9e04;
      margin-bottom: 15px;
      font-size: 1.5rem;
    }

    .scrivi-container p {
      margin-bottom: 25px;
      color: #fff;
      font-size: 1.1rem;
      font-style: italic;
      font-weight: 400;
      line-height: 1.6;
    }

    .btn-scrivi {
      display: inline-block;
      padding: 14px 35px;
      background: #d35400;
      color: white;
      border-radius: 30px;
      text-decoration: none;
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(211, 84, 0, 0.3);
    }

    .btn-scrivi:hover {
      background: #e67e22;
      transform: scale(1.05);
      color: white;
    }

    /* FOOTER */
    footer {
      position: fixed;
      bottom: 10px;
      right: 20px;
      z-index: 1;
      display: flex;
      gap: 20px;
      background: transparent;
    }

    footer a {
      color: #79f406;
      text-decoration: underline;
      font-size: 0.9rem;
    }

     </style>

</head>
<body>

<!-- PULSANTE HOME IN ALTO A DESTRA -->
<a href="index.html" style="
  position: absolute;
  top: 50px;
  right: 30px;
  padding: 8px 20px;
  background: rgba(10, 12, 20, 0.7);
  color: #f8d59e;
  border: 1px solid #f8d59e;
  border-radius: 20px;
  text-decoration: none;
  font-size: 0.9rem;
  transition: all 0.3s;
  z-index: 10;
">🏠 Home</a>

  <!-- CONTENUTO PRINCIPALE -->
  <main class="bacheca-content">
    
    <!-- BACHECA SCORREVOLE (CONTENITORE VUOTO: I DATI ARRIVANO DAL JSON) -->
    <div class="bacheca-container">
      <div class="bacheca-items" id="bacheca-items">
        <!-- Lo script inserirà qui i messaggi automaticamente -->
      </div>
    </div>

    <!-- PULSANTE PER SCRIVERE -->
    <div class="scrivi-container">
      <h3>✍️ Vuoi lasciare anche tu un pensiero?</h3>
      <p>Scrivi una dedica, un saluto o semplicemente un "ciao". I messaggi vengono approvati manualmente e pubblicati con amore.</p>
      <a href="https://forms.gle/B61BW2TfBzWJnKyX6" target="_blank" class="btn-scrivi">Scrivi un messaggio</a>
    </div>

  </main>

  <!-- FOOTER -->
  <footer>
    <a href="privacy-policy.html">Privacy Policy</a>
    <a href="cookie-policy.html">Cookie Policy</a>
  </footer>

  <!-- SCRIPT AUTOMATICO PER LA BACHECA -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      
      // === CARICAMENTO MESSAGGI DALLA BACHECA JSON ===
      const bachecaContainer = document.getElementById('bacheca-items');
      
      if (bachecaContainer) {
        fetch('bacheca-db.json')
          .then(response => response.json())
          .then(data => {
            let htmlContent = '';
            
            data.forEach(item => {
              htmlContent += `
                <div class="bacheca-item">
                  <img src="${item.avatar}" alt="${item.nome}">
                  <div class="bacheca-item-content">
                    <p>${item.messaggio}</p>
                    <span class="bacheca-item-autore">— ${item.nome}</span>
                    <span class="bacheca-item-data">${item.data}</span>
                  </div>
                </div>
              `;
            });

            bachecaContainer.innerHTML = htmlContent;

            // === AVVIA LO SCROLLING AUTOMATICO SOLO DOPO IL CARICAMENTO ===
            startScrolling();
          })
          .catch(error => console.error('Errore nel caricamento della bacheca:', error));
      }

      // === FUNZIONE SCROLLING ===
      function startScrolling() {
        const itemsContainer = document.getElementById('bacheca-items');
        if (!itemsContainer) return;

        const items = Array.from(itemsContainer.children);
        if (items.length === 0) return;

        let currentIndex = 0;
        let itemHeight = items[0].offsetHeight;
        
        // Ricalcola altezza se cambia finestra
        window.addEventListener('resize', () => {
            itemHeight = items[0].offsetHeight;
        });

        const displayDuration = 4000; // 4 secondi
        const transitionDuration = 1000; // 1 secondo

        // Duplica elementi per loop infinito
        items.forEach(item => {
          itemsContainer.appendChild(item.cloneNode(true));
        });

        setInterval(() => {
          currentIndex++;
          const totalItems = items.length;
          
          itemsContainer.style.transition = `transform ${transitionDuration / 1000}s ease-in-out`;
          itemsContainer.style.transform = `translateY(-${currentIndex * itemHeight}px)`;

          if (currentIndex >= totalItems) {
            setTimeout(() => {
              itemsContainer.style.transition = 'none';
              itemsContainer.style.transform = 'translateY(0)';
              currentIndex = 0;
            }, transitionDuration);
          }
        }, displayDuration + transitionDuration);
      }
    });
  </script>

</body>
</html>
