  <!-- Foglio di stile universale -->
  <link rel="stylesheet" href="css/stile.css">
  
  <style>
    /* --- SFONDO CON IMMAGINE --- */
    .hero {
      position: relative;
      height: 100vh;
      width: 100%;
      background: url('immagini/sfondo-home.jpg') no-repeat center center/cover;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      text-align: center;
      overflow: hidden;
      padding-top: 40px; /* <-- regola questo valore se vuoi spostare su/giù */
    }

    .hero-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, rgba(10, 12, 20, 0.4), rgba(10, 12, 20, 0.8));
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      padding: 0 20px;
      max-width: 800px;
    }

    .hero-content .subtitle {
      font-size: 2.2rem;
      font-family: 'Playfair Display', serif;
      color: var(--oro);
      opacity: 0.95;
      text-shadow: 0 0 20px rgba(248, 213, 158, 0.7);
      letter-spacing: 2px;
    }

    .hero-content .signature {
      margin-top: 30px;
      font-size: 1.3rem;
      font-style: italic;
      opacity: 0.8;
      letter-spacing: 2px;
      color: var(--oro);
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    @media (max-width: 768px) {
      .hero { padding-top: 120px; }
      .hero-content .subtitle { font-size: 1.6rem; }
      .hero-content .signature { font-size: 1rem; margin-top: 20px; }
    }
  </style>
</head>
<body>

  <!-- SFONDO CON TESTO -->
  <div class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <p class="subtitle">I testi delle nostre canzoni</p>
      <p class="signature">— con Rex, Bimba, Dj Ling 灵 e Dj Luna</p>
    </div>
  </div>
