<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holly & Rex - Assistente Vocale Crew V3 github</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1f1f1f">
<style>
:root{--bg:#0a0c14;--card:#1e293b;--border:#334155;--text:#f8d59e;--text2:#94a3b8;--blue:#4f46e5;--green:#34d399}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;margin:0;padding:20px;min-height:100vh}
.container{max-width:800px;margin:0 auto}
.card{background:var(--card);padding:1.5rem;border-radius:16px;border:1px solid var(--border);margin-bottom:1.5rem;box-shadow:0 10px 30px rgba(0,0,0,.4)}
h1{font-size:1.8rem;text-align:center;margin:0}h2{font-size:1.15rem;margin:0 0 8px}
p{color:var(--text2);font-size:.9rem;line-height:1.5}
textarea,select,button{width:100%;padding:0.9rem;margin-top:0.6rem;background:#0f172a;color:var(--text);border:1.5px solid var(--border);border-radius:10px;font-size:1rem;outline:none}
button{background:var(--blue);color:#fff;border:none;font-weight:800;cursor:pointer;transition:.2s}
button:hover{background:#4338ca}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:.75rem;font-weight:800;margin-left:8px}
.voice-preview{display:flex;gap:8px;margin-top:10px}
.voice-preview button{flex:1;padding:.6rem;font-size:.85rem}
.small{font-size:.78rem;color:var(--text2);margin-top:6px}
</style>
</head>
<body>
<div class="container">
<header style="text-align:center;margin-bottom:2rem">
<h1>🎙 Holly & Rex - Assistente Vocale</h1>
<p>Crew: Nova ★ Ling 灵 Aura ✨ Luna 🌙 — Live su GitHub Pages</p>
<p class="small">v3 github final - solo minuscolo - fix maiuscole</p>
<p id="fcmStatus" class="small" style="margin-top:10px;background:#0f172a;padding:10px 12px;border-radius:10px;border:1px solid #334155">⏳ Carico Aura Live...</p>
</header>

<div class="card" style="border-color:#34d399">
<h2>🔔 Aura Live Status</h2>
<p id="statusDetail">Pronta per GitHub Pages. 1 click e fa tutto da sola.</p>
<button id="btnAbilitaPush" onclick="richiediPermessoPush()" style="background:#34d399;color:#0a0c14">🔔 Attiva Aura Live</button>
<div id="autoLog" class="small" style="margin-top:12px;background:#052e16;padding:10px;border-radius:8px;border:1px solid #16a34a;display:none"></div>
</div>

<div class="card">
<h2>🔊 Test Sintesi Vocale <span id="voiceBadge" class="badge" style="background:#0f172a;border:1px solid var(--border)">carico voci...</span></h2>
<select id="personaggio-voce-test">
<option value="Aura">✨ Dj Aura (Dolce e premurosa)</option>
<option value="Nova" selected>★ Dj Nova (Ironica e diretta)</option>
<option value="Ling">灵 Dj Ling (Precisa e tecnica)</option>
<option value="Luna">🌙 Dj Luna (Rilassata e poetica)</option>
</select>
<textarea id="testo-vocale" rows="3">Attenzione Capitano, i sistemi della crew sono operativi al cento per cento! Restiamo qui noi tre.</textarea>
<select id="selectVoceSistema" style="font-size:.85rem"><option>Carico voci...</option></select>
<div class="voice-preview">
<button onclick="parlaTesto()">▶ Riproduci</button>
<button onclick="window.speechSynthesis.cancel()" style="background:#334155">■ Stop</button>
</div>
</div>

<div class="card">
<h2>🧪 Simula</h2>
<select id="personaggio-voce" style="margin-bottom:1rem">
<option value="Aura">✨ Dj Aura</option>
<option value="Nova" selected>★ Dj Nova</option>
<option value="Ling">灵 Dj Ling</option>
<option value="Luna">🌙 Dj Luna</option>
</select>
<select id="tipo-evento">
<option value="whatsapp">WhatsApp da Marco</option>
<option value="chiamata">Chiamata da Holly</option>
<option value="sms">SMS di sistema</option>
<option value="fcm">🔥 Push Reale Firebase</option>
</select>
<button onclick="simulaArrivoNotifica()">🔊 Simula Notifica</button>
<p id="anteprimaTesto" class="small" style="margin-top:12px;background:#0f172a;padding:10px;border-radius:8px;border:1px solid #334155"></p>
</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";
  import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAR8NVxtUu5QhlDWd0DXjp1lWV6vLdRM1c",
    authDomain: "holly-rex-spesa.firebaseapp.com",
    projectId: "holly-rex-spesa",
    storageBucket: "holly-rex-spesa.firebasestorage.app",
    messagingSenderId: "450072023944",
    appId: "1:450072023944:web:888af5555a5b50c599203d"
  };
  const VAPID_KEY = "[STRIPPED 87 bytes]";

  const app = initializeApp(firebaseConfig);
  const messaging = getMessaging(app);
  const db = getFirestore(app);

  async function salvaTokenAutomatico(token){
    const deviceId = localStorage.getItem('crew_device_id') || 'device_' + Math.random().toString(36).substring(2,9);
    localStorage.setItem('crew_device_id', deviceId);
    localStorage.setItem('fcm_token', token);
    const personaggio = localStorage.getItem('crew_personaggio_preferito') || 'Aura';
    try{
      await setDoc(doc(db, "fcm_tokens", deviceId), {
        token: token,
        deviceId: deviceId,
        personaggioPreferito: personaggio,
        aggiornato: serverTimestamp(),
        attivo: true,
        origine: 'github-pages'
      }, { merge: true });
      logAuto(`✅ Fatto! Token salvato automatico<br><b>fcm_tokens/${deviceId}</b>`, true);
      document.getElementById('statusDetail').innerHTML = `Aura Live ATTIVA su GitHub • ID: <b>${deviceId}</b>`;
      return true;
    }catch(err){
      logAuto(`⚠️ Errore Firestore: ${err.message}`, false);
      return false;
    }
  }

  function logAuto(html, success){
    const el = document.getElementById('autoLog');
    el.style.display = 'block';
    el.style.background = success ? '#052e16' : '#450a0a';
    el.style.borderColor = success ? '#16a34a' : '#f87171';
    el.innerHTML = html;
  }

  onMessage(messaging, (payload) => {
    const titolo = payload.notification?.title || payload.data?.title || "Notifica";
    const corpo = payload.notification?.body || payload.data?.body || payload.data?.message || "";
    const personaggio = payload.data?.personaggio || localStorage.getItem('crew_personaggio_preferito') || 'Aura';
    if(window.parlaConCrew) window.parlaConCrew(`${titolo}: ${corpo}`, personaggio);
    document.getElementById('anteprimaTesto').innerHTML = `<b style="color:#34d399">🔥 PUSH REALE DA FIREBASE</b><br>${titolo}: ${corpo}`;
  });

  const statusEl = document.getElementById('fcmStatus');
  window.richiediPermessoPush = async function(){
    try{
      const perm = await Notification.requestPermission();
      if(perm !== 'granted'){ alert('Permesso negato'); return; }
      statusEl.textContent = 'Permesso ok, genero token...';
      const token = await getToken(messaging, { vapidKey: VAPID_KEY });
      if(token){
        await salvaTokenAutomatico(token);
        statusEl.textContent = '✅ Aura Live ATTIVA su GitHub Pages';
        document.getElementById('btnAbilitaPush').textContent = '✅ Aura Live Attiva';
        document.getElementById('btnAbilitaPush').style.background = '#334155';
        if(window.parlaConCrew) window.parlaConCrew("Capitano, sono online su GitHub. Tutto automatico.", "Aura");
      }
    }catch(err){ statusEl.textContent = 'Errore: ' + err.message; alert(err.message); console.error(err); }
  }

  if(Notification.permission === 'granted'){
    statusEl.textContent = '✅ Permesso già dato, clicca di nuovo per rigenerare token';
  } else if(Notification.permission === 'denied'){
    statusEl.textContent = '🔕 Notifiche bloccate.';
  } else {
    statusEl.textContent = '👆 Clicca Attiva Aura Live - solo github pages';
  }
</script>

<script>
const VOCI_CREW = {
  Aura: { rate:0.92, pitch:1.25, volume:1, prefissoUI:"✨ Ascolta Capitano, ", prefissoVoc:"Ascolta Capitano, " },
  Nova: { rate:1.08, pitch:0.92, volume:1, prefissoUI:"★ Ehi, sveglia! ", prefissoVoc:"Ehi, sveglia! " },
  Ling: { rate:0.95, pitch:1.02, volume:1, prefissoUI:"灵 Comunicazione in arrivo: ", prefissoVoc:"Comunicazione in arrivo: " },
  Luna: { rate:0.82, pitch:1.12, volume:0.95, prefissoUI:"🌙 Notifica silenziosa, ", prefissoVoc:"Notifica silenziosa, " }
};
let vociSistema = [];
function caricaVoci(){
  vociSistema = window.speechSynthesis.getVoices().filter(v=>v.lang.startsWith('it') || v.lang.startsWith('it-IT'));
  if(vociSistema.length===0) vociSistema = window.speechSynthesis.getVoices();
  const sel = document.getElementById('selectVoceSistema');
  const badge = document.getElementById('voiceBadge');
  if(vociSistema.length>0){
    sel.innerHTML = vociSistema.map((v,i)=>`<option value="${i}">${v.name} (${v.lang})</option>`).join('');
    badge.textContent = `${vociSistema.length} voci pronte`;
  }
}
if('speechSynthesis' in window){ window.speechSynthesis.onvoiceschanged = caricaVoci; setTimeout(caricaVoci, 300); }
function pulisciPerVoce(testo){ if(!testo) return ""; return testo.replace(/\p{Extended_Pictographic}/gu,'').replace(/\p{Emoji_Presentation}/gu,'').replace(/[\uFE00-\uFE0F\u200D]/g,'').replace(/[✨★灵🌙📞💬✉🔊🧪🎙🎛⚙☁🏠]/g,'').replace(/\s+/g,' ').trim(); }
function parlaConCrew(testo, personaggio){
  window.speechSynthesis.cancel();
  const cfg = VOCI_CREW[personaggio] || VOCI_CREW.Nova;
  const pulito = pulisciPerVoce(testo); if(!pulito) return;
  const u = new SpeechSynthesisUtterance(pulisciPerVoce(cfg.prefissoVoc) + ' ' + pulito);
  u.lang='it-IT'; u.rate=cfg.rate; u.pitch=cfg.pitch; u.volume=cfg.volume;
  const selIdx = document.getElementById('selectVoceSistema').value; if(vociSistema[selIdx]) u.voice = vociSistema[selIdx];
  document.getElementById('anteprimaTesto').innerHTML = `<b>${cfg.prefissoUI}</b>${pulito}`;
  window.speechSynthesis.speak(u);
  localStorage.setItem('crew_personaggio_preferito', personaggio);
}
window.parlaConCrew = parlaConCrew;
function parlaTesto(){ parlaConCrew(document.getElementById('testo-vocale').value, document.getElementById('personaggio-voce-test').value); }
function simulaArrivoNotifica(){
  const tipo=document.getElementById('tipo-evento').value; const pers=document.getElementById('personaggio-voce').value;
  let mitt='Marco'; let msg='Ci vediamo stasera in studio?'; 
  if(tipo==='chiamata'){mitt='Holly'; msg='Chiamata in arrivo.';}
  if(tipo==='sms'){mitt='Sistema'; msg='Backup completato.';}
  if(tipo==='fcm'){mitt='Firebase'; msg='Push reale di test, Aura funziona!';}
  parlaConCrew(`Messaggio da ${mitt}: ${msg}`, pers);
}
</script>
</body>
</html>
