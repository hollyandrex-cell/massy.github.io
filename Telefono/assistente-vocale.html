<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holly & Rex - Assistente Vocale Crew</title>
<link rel="icon" href="./bau-192x192.png" type="image/png">
<link rel="apple-touch-icon" href="./bau-192x192.png">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1f1f1f">
<style>
:root{--bg:#0a0c14;--card:#1e293b;--border:#334155;--text:#f8d59e;--text2:#94a3b8;--blue:#4f46e5;--green:#34d399}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;margin:0;padding:20px;min-height:100vh}
.container{max-width:800px;margin:0 auto}
.card{background:var(--card);padding:1.5rem;border-radius:16px;border:1px solid var(--border);margin-bottom:1.5rem;box-shadow:0 10px 30px rgba(0,0,0,.4)}
h1{font-size:1.8rem;text-align:center;margin:0}
p{color:var(--text2);font-size:.9rem;line-height:1.5}
button{width:100%;padding:0.9rem;margin-top:0.6rem;background:#0f172a;color:var(--text);border:1.5px solid var(--border);border-radius:10px;font-size:1rem;outline:none}
button.primary{background:var(--blue);color:#fff;border:none;font-weight:800;cursor:pointer}
button.success{background:var(--green);color:#0a0c14;border:none;font-weight:800}
.small{font-size:.78rem;color:var(--text2);margin-top:6px}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:.75rem;font-weight:800;background:#0f172a;border:1px solid var(--border)}
</style>
</head>
<body>
<div class="container">
<header style="text-align:center;margin-bottom:2rem">
<h1>🎙 Holly & Rex - Assistente Vocale</h1>
<p>Crew: Nova ★ Ling 灵 Aura ✨ Luna 🌙 — fix 404 definitivo + favicon</p>
<p id="fcmStatus" class="small" style="margin-top:10px;background:#0f172a;padding:10px 12px;border-radius:10px;border:1px solid #334155">⏳ Inizializzo fix 404...</p>
</header>

<div class="card" style="border-color:#34d399">
<h2>🔔 Aura Live Status <span id="deviceBadge" class="badge">...</span></h2>
<p id="statusDetail">Registro SW in /Telefono/ per evitare 404 root</p>
<button id="btnAbilitaPush" class="success" onclick="richiediPermessoPush()">🔔 Attiva Aura Live (1° click)</button>
<div id="autoLog" class="small" style="margin-top:12px;background:#052e16;padding:10px;border-radius:8px;border:1px solid #16a34a;display:none"></div>
</div>

<div class="card">
<h2>🧪 Test Vocale Locale</h2>
<p id="anteprimaTesto" class="small" style="background:#0f172a;padding:10px;border-radius:8px;border:1px solid #334155">Pronto per test</p>
<button class="primary" onclick="if(window.parlaConCrew) parlaConCrew('Fix quattro zero quattro risolto, Capitano. Sono online in Telefono con icona Bau.','Aura')">▶ Test Aura</button>
</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";
  import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAR8NVxtUu5QhlDWd0DXjp1lWV6vLdRM1c",
    authDomain: "holly-rex-spesa.firebaseapp.com",
    projectId: "holly-rex-spesa",
    storageBucket: "holly-rex-spesa.firebasestorage.app",
    messagingSenderId: "450072023944",
    appId: "1:450072023944:web:888af5555a5b50c599203d"
  };
  const VAPID_KEY = "BITcZCNvdTe5aOlicwRVC5W__NX3cFo_4GxGDEVS8Dh5sf0vRONa7yvn3UZJjIIsk02yoKs-tnFv-Ap5vVIDl5c";

  const app = initializeApp(firebaseConfig);
  const messaging = getMessaging(app);
  const db = getFirestore(app);
  let swRegistration = null;

  async function registraSWFix(){
    if(!('serviceWorker' in navigator)) return null;
    try{
      // FIX FONDAMENTALE: registra da Telefono/ con scope relativo
      const reg = await navigator.serviceWorker.register('./firebase-messaging-sw.js', { scope: './' });
      console.log('SW registrato fix:', reg.scope);
      swRegistration = reg;
      return reg;
    }catch(e){
      console.error('SW register fallita', e);
      return null;
    }
  }

  async function salvaTokenAutomatico(token){
    const deviceId = localStorage.getItem('crew_device_id') || 'device_' + Math.random().toString(36).substring(2,9);
    localStorage.setItem('crew_device_id', deviceId);
    localStorage.setItem('fcm_token', token);
    document.getElementById('deviceBadge').textContent = deviceId;
    try{
      await setDoc(doc(db, "fcm_tokens", deviceId), {
        token: token,
        deviceId: deviceId,
        personaggioPreferito: 'Aura',
        aggiornato: serverTimestamp(),
        attivo: true,
        origine: 'github-pages-fix-404-favicon'
      }, { merge: true });
      const log = document.getElementById('autoLog');
      log.style.display='block';
      log.style.background='#052e16';
      log.innerHTML = `✅ TOKEN PRESO IN AUTOMATICO - FIX 404 OK<br><b>fcm_tokens/${deviceId}</b><br><span style="word-break:break-all;font-size:10px">${token.substring(0,60)}...</span>`;
      document.getElementById('statusDetail').innerHTML = `Aura Live ATTIVA • ID: <b>${deviceId}</b> • Nessun 404`;
      return true;
    }catch(err){
      const log = document.getElementById('autoLog');
      log.style.display='block';
      log.style.background='#450a0a';
      log.innerHTML = `⚠️ Errore salvataggio: ${err.message}`;
      return false;
    }
  }

  const statusEl = document.getElementById('fcmStatus');

  window.richiediPermessoPush = async function(){
    try{
      const perm = await Notification.requestPermission();
      if(perm !== 'granted'){ alert('Permesso negato'); return; }
      statusEl.textContent = 'Permesso OK, registro SW in /Telefono/...';
      const reg = swRegistration || await registraSWFix();
      if(!reg){ alert('SW non registrato'); return; }
      statusEl.textContent = 'SW OK, prendo token in automatico con registration...';
      const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
      if(token){
        await salvaTokenAutomatico(token);
        statusEl.textContent = '✅ Aura Live ATTIVA - 404 risolto!';
        document.getElementById('btnAbilitaPush').textContent = '✅ Aura Live Attiva - token auto';
      }
    }catch(err){
      statusEl.textContent = 'Errore dopo SI: ' + err.message;
      console.error(err);
      alert('Errore dopo SI (quello di prima): ' + err.message);
    }
  }

  // AVVIO: se permesso gia' granted, prende token in automatico senza click
  (async ()=>{
    const reg = await registraSWFix();
    if(!reg){ statusEl.textContent = '❌ SW non registrato in Telefono/'; return; }
    
    const existingId = localStorage.getItem('crew_device_id');
    if(existingId) document.getElementById('deviceBadge').textContent = existingId;

    if(Notification.permission === 'granted'){
      statusEl.textContent = '✅ Permesso gia presente, prendo token in AUTO...';
      try{
        const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
        if(token){
          await salvaTokenAutomatico(token);
          statusEl.textContent = '✅ Aura Live ATTIVA in AUTO - 404 risolto!';
          document.getElementById('btnAbilitaPush').textContent = '✅ Aura Live Attiva (auto)';
          document.getElementById('btnAbilitaPush').style.background = '#334155';
        } else {
          statusEl.textContent = 'Permesso ok ma token vuoto, clicca bottone';
        }
      }catch(e){
        statusEl.textContent = 'Errore auto token: ' + e.message + ' - clicca bottone';
      }
    } else if(Notification.permission === 'denied'){
      statusEl.textContent = '🔕 Notifiche bloccate - sbloccale dalle impostazioni';
    } else {
      statusEl.textContent = '👆 Fix 404 attivo - clicca Attiva Aura Live (1° volta)';
    }
  })();

  onMessage(messaging, (payload) => {
    const titolo = payload.notification?.title || payload.data?.title || "Notifica";
    const corpo = payload.notification?.body || payload.data?.body || payload.data?.message || "";
    if(window.parlaConCrew) window.parlaConCrew(`${titolo}: ${corpo}`, 'Aura');
    document.getElementById('anteprimaTesto').innerHTML = `<b style="color:#34d399">🔥 PUSH REALE</b><br>${titolo}: ${corpo}`;
  });
</script>

<script>
// Voce minimale per test
function pulisciPerVoce(t){return t.replace(/\p{Extended_Pictographic}/gu,'').replace(/[✨★灵🌙]/g,'').trim();}
function parlaConCrew(testo, pers){
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(pulisciPerVoce(testo));
  u.lang='it-IT'; u.rate=0.92; u.pitch=1.2;
  document.getElementById('anteprimaTesto').textContent = testo;
  speechSynthesis.speak(u);
}
window.parlaConCrew = parlaConCrew;
</script>
</body>
</html>
