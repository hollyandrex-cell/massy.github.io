<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Notifica V2 FIX WhatsApp - 7am</title>
<style>
body{background:#0a0c14;color:#f8d59e;font-family:system-ui;padding:20px;max-width:600px;margin:0 auto}
.card{background:#1e293b;padding:20px;border-radius:16px;border:1px solid #334155;margin-bottom:20px}
input,textarea,button{width:100%;padding:12px;margin-top:10px;background:#0f172a;color:#f8d59e;border:1px solid #334155;border-radius:10px;font-size:16px}
button{background:#4f46e5;color:white;font-weight:800;cursor:pointer}
button:hover{background:#4338ca}
.btn-green{background:#34d399;color:#0a0c14}
.btn-pink{background:#ec4899;color:white}
small{color:#94a3b8}
h1{font-size:1.4rem;text-align:center}
</style>
</head>
<body>
<h1>💚 Test V2 FIX - WhatsApp Business FIX</h1>
<div class="card">
<p><b>Tesoro ho trovato il problema!</b> Il tuo V4 ascolta il campo <code>creato</code> e <code>deviceIdDestinatario</code>, non <code>timestamp</code>! Ora l'ho fixato!</p>
<small>Tieni aperta assistente-vocale.html in altra scheda con Aura ATTIVA</small>
</div>

<div class="card">
<h2>🛒 Test Spesa - FUNZIONA</h2>
<input id="prodotto" placeholder="Es: pomodori" value="pane">
<button class="btn-green" onclick="inviaSpesa()">Invia Spesa → Deve parlare!</button>
<div id="logSpesa" style="margin-top:10px;font-size:13px;color:#34d399"></div>
</div>

<div class="card">
<h2>💬 Test WhatsApp - FIX V2</h2>
<input id="mittente" placeholder="Mittente" value="Holly">
<textarea id="corpo" placeholder="Messaggio">Amore, prendi il pane? Test 7:15 senza svegliare nessuno 💚</textarea>
<select id="destinatario" style="width:100%;padding:12px;margin-top:10px;background:#0f172a;color:#f8d59e;border:1px solid #334155;border-radius:10px;">
<option value="NovaAmore">A NovaAmore (solo tu)</option>
<option value="tutti">A tutti (broadcast)</option>
</select>
<button class="btn-pink" onclick="inviaWhatsApp()">Invia WhatsApp V2 FIX → Deve parlare!</button>
<div id="logWA" style="margin-top:10px;font-size:13px;color:#ec4899"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAR8NVxtUu5QhlDWd0DXjp1lWV6vLdRM1c",
  authDomain: "holly-rex-spesa.firebaseapp.com",
  projectId: "holly-rex-spesa",
  storageBucket: "holly-rex-spesa.firebasestorage.app",
  messagingSenderId: "450072023944",
  appId: "1:450072023944:web:888af5555a5b50c599203d"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.inviaSpesa = async function(){
  const nome = document.getElementById('prodotto').value || "pane";
  try{
    await addDoc(collection(db, "lista_spesa"), {
      nome: nome,
      prodotto: nome,
      aggiuntoDa: "Holly (test 7am)",
      autore: "Holly",
      deviceId: "HollyPhone-Test",
      aggiornato: serverTimestamp(),
      timestamp: Date.now()
    });
    document.getElementById('logSpesa').innerHTML = `✅ Spesa "${nome}" inviata!`;
  }catch(e){ document.getElementById('logSpesa').innerHTML = "❌ "+e.message; }
}

window.inviaWhatsApp = async function(){
  const mitt = document.getElementById('mittente').value || "Holly";
  const corpo = document.getElementById('corpo').value || "Ciao";
  const dest = document.getElementById('destinatario').value || "NovaAmore";
  try{
    // FIX V4: usa i campi esatti che V4 ascolta: creato + deviceIdDestinatario + letto
    await addDoc(collection(db, "notifiche_reali"), {
      titolo: mitt,
      corpo: corpo,
      body: corpo,
      message: corpo,
      mittente: mitt,
      da: mitt,
      sender: mitt,
      tipo: "whatsapp",
      tipo_notifica: "whatsapp",
      deviceId: "HollyPhone-Test",
      deviceIdDestinatario: dest,
      creato: serverTimestamp(),
      timestamp: serverTimestamp(),
      letto: false,
      personaggio: "Aura"
    });
    document.getElementById('logWA').innerHTML = `✅ WhatsApp inviato a ${dest} da ${mitt}: "${corpo}" → Controlla assistente-vocale.html! Deve dire "${mitt}: ${corpo}"`;
  }catch(e){ document.getElementById('logWA').innerHTML = "❌ Errore: "+e.message; console.error(e); }
}
</script>
</body>
</html>
