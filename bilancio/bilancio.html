<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holly AND Rex Group - Console di Bilancio</title>
    <link rel="icon" href="/massy.github.io/bau-192x192.png" type="image/png">
    <link rel="apple-touch-icon" href="/massy.github.io/bau-180.png">
    <link rel="manifest" href="/massy.github.io/manifest.json">
    <style>
        :root { --bg: #0a0c14; --card: #1e293b; --border: #334155; --text: #f8d59e; --text2: #94a3b8; --green: #22c55e; --red: #ef4444; --blue: #4f46e5; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; min-height: 100vh; }
        header { text-align: center; margin-bottom: 2rem; }
        h1 { margin: 0; font-size: 2rem; }
       .subtitle { color: var(--text2); margin: 0.5rem 0; }
       .crew-tags { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; margin-top: 1rem; }
       .tag { background: var(--card); padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.85rem; border: 1px solid var(--border); }
       .container { max-width: 1200px; margin: 0 auto; }
       .riepilogo-box { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
       .card { background: var(--card); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
       .card h3 { margin: 0 0 0.5rem 0; font-size: 0.9rem; color: var(--text2); font-weight: normal; }
       .card p { margin: 0; font-size: 2rem; font-weight: bold; }
       .entrate p { color: var(--green); }
       .uscite p { color: var(--red); }
       .saldo p { color: var(--text); }
       .trends-box,.form-box,.print-zone,.lista-box { background: var(--card); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 2rem; }
       .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
       .input-group label { display: block; margin-bottom: 0.3rem; color: var(--text2); font-size: 0.9rem; }
       .input-group input,.input-group select { width: 100%; padding: 0.6rem; background: #0f172a; color: var(--text); border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; }
       .btn-invia,.btn-backup { width: 100%; padding: 0.8rem; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; }
       .btn-invia { background: var(--blue); color: white; margin-top: 1rem; }
       .btn-del { background: #7f1d1d; color: white; border: none; padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
       table { width: 100%; border-collapse: collapse; }
       th { text-align: left; padding: 0.8rem; border-bottom: 2px solid var(--border); color: var(--text2); }
       td { padding: 0.8rem; border-bottom: 1px solid #1e293b; }
       .valore-pos { color: var(--green); font-weight: bold; }
       .valore-neg { color: var(--red); font-weight: bold; }
       .site-footer { margin-top: 40px; border-top: 1px solid #334155; padding-top: 20px; text-align: center; font-size: 0.75rem; color: #64748b; }
       .site-footer a { color: #94a3b8; text-decoration: none; margin: 0 10px; }
    </style>
</head>
<body>
<header><h1>🌌 Holly AND Rex Group</h1><p class="subtitle">Console di Controllo Economico</p></header>
<main class="container">
<section class="riepilogo-box">
<div class="card entrate"><h3>Entrate</h3><p id="totale-entrate">0.00 €</p></div>
<div class="card uscite"><h3>Uscite</h3><p id="totale-uscite">0.00 €</p></div>
<div class="card saldo"><h3>Saldo</h3><p id="saldo-totale">0.00 €</p></div>
</section>
<section class="form-box">
<h2>🎵 Inserisci Nuovo Flusso</h2>
<form id="form-movimento">
<div class="grid-inputs">
<div class="input-group"><label>Tipo</label><select id="tipo"><option value="uscita">Spesa / Uscita (-)</option><option value="entrata">Ricavo / Entrata (+)</option></select></div>
<div class="input-group"><label>Categoria</label><select id="categoria">
<option value="Casa / Affitto">🏠 Affitto / Mutuo</option>
<option value="Bollette / Utenze">💡 Bollette</option>
<option value="Spesa / Cibo">🛒 Spesa Alimentare</option>
<option value="Animali">🐾 Animali Domestici</option>
<option value="Stipendio / Fisso">Stipendio / Pensione</option>
</select></div>
</div>
<div class="grid-inputs">
<div class="input-group"><label>Importo (€)</label><input type="number" id="importo" step="0.01" required></div>
<div class="input-group"><label>Descrizione</label><input type="text" id="descrizione" required></div>
</div>
<button type="submit" class="btn-invia">Registra nella Console</button>
</form>
</section>
<section class="lista-box">
<h2>📜 Storico</h2>
<table><thead><tr><th>Data</th><th>Categoria</th><th>Dettaglio</th><th>Valore</th><th>Azione</th></tr></thead><tbody id="registro-movimenti"></tbody></table>
</section>
<div class="site-footer"><p>© 2026 Holly & Rex Group</p><p><a href="/massy.github.io/ricette/privacy-policy.html">Privacy</a> | <a href="/massy.github.io/ricette/cookie-policy.html">Cookie</a></p></div>
</main>
<script>
const STORAGE_KEY='hollyRexBilancio_v3';
let movimenti=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
function salvaDati(){localStorage.setItem(STORAGE_KEY, JSON.stringify(movimenti));}
function aggiornaTutto(){
 const tbody=document.getElementById('registro-movimenti'); tbody.innerHTML='';
 let ent=0, usc=0;
 movimenti.forEach((mov,i)=>{
  const isEntrata=mov.tipo==='entrata'; const val=parseFloat(mov.importo);
  if(isEntrata) ent+=val; else usc+=val;
  const tr=document.createElement('tr');
  tr.innerHTML=`<td>${new Date(mov.data).toLocaleDateString('it-IT')}</td><td>${mov.categoria}</td><td>${mov.descrizione}</td><td class="${isEntrata?'valore-pos':'valore-neg'}">${isEntrata?'+':'-'}${val.toFixed(2)} €</td><td><button class="btn-del" onclick="eliminaMovimento(${i})">X</button></td>`;
  tbody.appendChild(tr);
 });
 document.getElementById('totale-entrate').textContent=ent.toFixed(2)+' €';
 document.getElementById('totale-uscite').textContent=usc.toFixed(2)+' €';
 document.getElementById('saldo-totale').textContent=(ent-usc).toFixed(2)+' €';
}
window.eliminaMovimento=(i)=>{ if(confirm('Eliminare?')){movimenti.splice(i,1); salvaDati(); aggiornaTutto();}};
document.getElementById('form-movimento').addEventListener('submit',(e)=>{
 e.preventDefault();
 movimenti.unshift({id:Date.now(), data:new Date().toISOString(), tipo:document.getElementById('tipo').value, categoria:document.getElementById('categoria').value, importo:parseFloat(document.getElementById('importo').value), descrizione:document.getElementById('descrizione').value});
 salvaDati(); aggiornaTutto(); e.target.reset();
});
window.addEventListener('DOMContentLoaded', aggiornaTutto);
if('serviceWorker' in navigator){ navigator.serviceWorker.register('/massy.github.io/sw.js').then(()=>console.log('SW Group v1 root ok')).catch(e=>console.log('SW fail',e)); }
</script>
</body>
</html>
